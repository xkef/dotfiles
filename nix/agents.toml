# Registry of sandboxed AI agents. nix/agents.nix renders the fish
# launchers, the `sb` dispatch and its completions, the nono profiles, and
# each agent's global rules file from it.
#
# Fields:
#   description  function description and `sb` completion text
#   install      fish command the launcher runs when the binary is missing.
#                Absent means the package manager installs it.
#   unsandboxed  subcommands the launcher runs outside the sandbox, such as
#                a self-update that replaces the binary
#   prelaunch    fish snippet the launcher runs before starting the agent
#   args         arguments `sb` passes to the agent inside the sandbox
#   touch        files `sb` creates before launch so allow_file grants apply
#   rules        global rules file, relative to $HOME, that receives
#                nix/files/agents-base.md
#   state        the agent's own paths, which the rules file names as
#                granted by the sandbox
#   nono         profile data: version, description, extra policy groups,
#                agent state paths, and `extra` for fields beyond the shared
#                toolchain surface in nix/agents.nix

[agents.claude]
description = "Claude Code"
rules = ".claude/CLAUDE.md"
state = "`~/.claude/` and `~/.config/claude-code/`"
install = "curl -fsSL https://claude.ai/install.sh | bash -s -- latest"
# `claude update` writes a new version under ~/.local/share/claude and
# replaces the ~/.local/bin/claude symlink. The profile grants neither, and
# widening it would let the agent replace its own binary and every other
# user tool in ~/.local/bin.
unsandboxed = ["update"]
# nono is the OS-level sandbox, and macOS can't nest Seatbelt, so Claude
# Code's own bash sandbox stays off. With it on, every Bash command fails
# with "sandbox_apply: Operation not permitted". The sandbox block in
# claude-settings.json applies only to `command claude` runs.
args = ["--settings", '{"sandbox":{"enabled":false}}']
touch = ["$HOME/.claude.json.lock"]

[agents.claude.nono]
version = "1.3.1"
description = "Claude Code with mise, jj, maven, npm, cargo, and keychain access"
# Copied from the registry pack always-further/claude. The pack still uses
# the `undo` field that nono 0.75 renamed to `rollback`, so nono rejects it.
# Once the pack updates, drop groups, allow_file, and extra, and set
# `extends: "claude-code"`.
groups = [
  { name = "claude_code_macos", when = "macos" },
  { name = "claude_code_linux", when = "linux" },
  { name = "claude_cache_linux", when = "linux" },
  "rust_runtime",
  "python_runtime",
  { name = "vscode_macos", when = "macos" },
  { name = "vscode_linux", when = "linux" },
  { name = "linux_sysfs_read", when = "linux" },
]
allow = [
  "$HOME/.claude",
  "$XDG_CONFIG_HOME/claude-code",
  "$HOME/.local/state/claude/locks",
  "$HOME/.cache/claude",
  "$HOME/.config/nono/profile-drafts",
  "/tmp/claude-$UID",
]
allow_file = [
  "$HOME/.claude.json",
  "$HOME/.claude.json.lock",
  "$HOME/.claude.lock",
]

[agents.claude.nono.extra]
network = { block = false }
allow_launch_services = true
security = { signal_mode = "isolated", capability_elevation = false }
diagnostics = { suppress_system_services = ["forbidden-exec-sugid"] }

[agents.claude.nono.extra.open_urls]
allow_origins = [
  "https://claude.ai",
  "https://claude.com",
  "https://api.anthropic.com",
  "https://platform.claude.com",
]
allow_localhost = true

[agents.claude.nono.extra.rollback]
exclude_patterns = ["node_modules", ".next", "__pycache__", "target"]
exclude_globs = ["*.tmp.[0-9]*.[0-9]*"]
