name: CI

# lint runs the portable subset of `mise run lint`. The Neovim check needs
# installed plugins and stays local. check runs `mise run check`, which
# applies the whole chezmoi source tree into a throwaway HOME and asserts the
# result, a fast signal on every push. e2e-macos and e2e-arch run the real
# thing: chezmoi init --apply with run scripts, so packages install,
# macos-defaults applies, and the resulting shell starts. The package script
# templates skip casks and Arch GUI packages under CI.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Shellcheck
        run: mise run lint-sh
      - name: Fish syntax
        run: mise run lint-fish
      - name: Markdown format
        run: mise run lint-fmt
      - name: Markdown lint
        run: mise run lint-md
      - name: Prose lint
        run: mise run lint-prose

  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install fish
        run: if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y fish; else brew install fish; fi
      - name: Apply into throwaway HOME
        run: mise run check

  e2e-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install chezmoi
        run: brew install chezmoi
      - name: Full setup (files + run scripts)
        env:
          GITHUB_TOKEN: ${{ github.token }} # mise version lookups rate-limit without it
        # A fresh Mac runs the README one-liner from a shell that predates
        # Homebrew, so PATH has no /opt/homebrew/bin. Reproduce that. The run
        # scripts must find the tools they install on their own.
        run: |
          env PATH=/usr/bin:/bin:/usr/sbin:/sbin "$(brew --prefix)/bin/chezmoi" init --source "$PWD" \
            --promptBool "work machine (render 1Password git identity)=false" \
            --apply
      - name: Verify the machine actually works
        run: |
          chezmoi doctor
          chezmoi verify --exclude scripts
          fish -c 'echo fish boots'
          for f in ~/.config/fish/config.fish ~/.config/fish/conf.d/*.fish ~/.config/fish/functions/*.fish; do fish -n "$f"; done
          ~/.local/bin/theme --current
          ~/.local/bin/dots-keys --raw | tail -3

  e2e-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Bootstrap container (sudo + builder user)
        run: |
          pacman -Syu --noconfirm sudo git base-devel chezmoi
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Full setup as builder (real pacman + paru/AUR)
        env:
          GITHUB_TOKEN: ${{ github.token }} # mise version lookups rate-limit without it
        run: |
          chown -R builder: "$PWD"
          sudo -u builder env HOME=/home/builder CI=true GITHUB_TOKEN="$GITHUB_TOKEN" chezmoi init \
            --source "$PWD" \
            --promptBool "work machine (render 1Password git identity)=false" \
            --apply
      - name: Verify the machine actually works
        # TMPDIR must share a mount with the checkout. doctor's hardlink
        # check links from the source dir into TMPDIR, and /tmp sits on the
        # container filesystem while the workspace is a Docker volume.
        run: |
          tmp="$(dirname "$PWD")/tmp"
          mkdir -p "$tmp" && chown builder: "$tmp"
          sudo -u builder env HOME=/home/builder TMPDIR="$tmp" sh -c '
            set -e
            chezmoi doctor
            chezmoi verify --exclude scripts
            fish -c "echo fish boots"
            for f in ~/.config/fish/config.fish ~/.config/fish/conf.d/*.fish ~/.config/fish/functions/*.fish; do fish -n "$f"; done
            ~/.local/bin/theme --current
            ~/.local/bin/dots-keys --raw | tail -3
          '
