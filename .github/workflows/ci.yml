name: CI

# lint runs the portable subset of `mise run lint`. The Neovim check needs
# installed plugins and stays local. darwin builds the whole nix-darwin
# system, which evaluates every module and fetches every package, without
# switching the runner to it. linux runs the real thing: home-manager
# switches a fresh account, so packages install, activation runs, and the
# resulting shell starts.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Shellcheck
        run: mise run lint-sh
      - name: Fish syntax
        run: mise run lint-fish
      - name: Markdown format
        run: mise run lint-fmt
      - name: Markdown lint
        run: mise run lint-md
      - name: Prose lint
        run: mise run lint-prose

  darwin:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build the nix-darwin system
        run: nix build .#darwinConfigurations.mac.system

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # The config names its account and checkout path, so switch as that
      # account with the repo where it expects it. Each step runs as the
      # account with a clean environment, as a fresh login would, because
      # the runner exports XDG_* variables that point into its own home. The
      # steps start in /tmp, since the account can't read the checkout's
      # directory, and fish then can't resolve paths.
      - name: Create the account
        run: |
          sudo useradd -m kk
          sudo cp -r "$PWD" /home/kk/dotfiles
          sudo chown -R kk: /home/kk/dotfiles
          # home-manager's first switch fails without a profile directory.
          sudo -u kk mkdir -p /home/kk/.local/state/nix/profiles
      - name: Switch with home-manager
        env:
          GITHUB_TOKEN: ${{ github.token }} # mise version lookups rate-limit without it
        working-directory: /tmp
        run: |
          sudo -u kk env -i HOME=/home/kk USER=kk GITHUB_TOKEN="$GITHUB_TOKEN" \
            PATH=/nix/var/nix/profiles/default/bin:/usr/bin:/bin \
            nix run home-manager -- switch --flake /home/kk/dotfiles#x86_64-linux
      # A login shell reads conf.d, which puts the home-manager profile on
      # PATH. fish comes from nixpkgs, since Ubuntu ships fish 3 and every
      # machine this config targets runs fish 4.
      - name: Verify the machine actually works
        working-directory: /tmp
        run: |
          sudo -u kk env -i HOME=/home/kk USER=kk \
            PATH=/nix/var/nix/profiles/default/bin:/usr/bin:/bin \
            nix shell nixpkgs#fish --command fish --login -c '
            echo fish boots
            for f in ~/.config/fish/config.fish ~/.config/fish/conf.d/*.fish ~/.config/fish/functions/*.fish
              fish -n $f; or exit 1
            end
            theme --current; or exit 1
            dots-keys --raw | tail -3; or exit 1
            test -s ~/.config/nono/profiles/claude.json; or exit 1
            cd ~; mise ls; or exit 1
            test -z (mise ls --missing | string collect); or exit 1
          '
