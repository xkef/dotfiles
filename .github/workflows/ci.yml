name: CI

# The portable subset of `make lint`: shellcheck, Markdown formatting, and
# Markdown lint. The fish and Neovim checks need binaries the runner lacks
# and stay local-only.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
          cache: true
      - name: Shellcheck
        run: git ls-files -z | xargs -0 shfmt -f | xargs shellcheck -S warning
      - name: Markdown format
        run: dprint check
      - name: Markdown lint
        run: rumdl check
