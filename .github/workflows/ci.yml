name: CI

# lint: the portable subset of `make lint` (the Neovim check needs installed
# plugins and stays local-only). check: `make check` applies the whole
# chezmoi source tree into a throwaway HOME and asserts the result — fast
# signal on every push. e2e-macos / e2e-arch: the real thing — chezmoi init
# --apply WITH run scripts, so packages install, macos-defaults applies, and
# the resulting shell actually starts. Casks and Arch GUI packages are
# skipped under CI (see the package script templates).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Shellcheck
        run: make lint-sh
      - name: Fish syntax
        run: make lint-fish
      - name: Markdown format
        run: dprint check
      - name: Markdown lint
        run: make lint-md

  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          cache: true
      - name: Apply into throwaway HOME
        run: make check

  e2e-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install chezmoi
        run: brew install chezmoi
      - name: Full setup (files + run scripts)
        env:
          GITHUB_TOKEN: ${{ github.token }} # mise version lookups rate-limit without it
        run: |
          chezmoi init --source "$PWD" \
            --promptBool "work machine (render 1Password git identity)=false" \
            --apply
      - name: Verify the machine actually works
        run: |
          chezmoi doctor
          chezmoi verify --exclude scripts
          fish -c 'echo fish boots'
          fish -n ~/.config/fish/config.fish
          tmux -L ci -f ~/.config/tmux/tmux.conf start-server \; kill-server
          ~/.local/bin/theme --current
          ~/.local/bin/dots-keys --raw | tail -3
          mise ls

  e2e-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Bootstrap container (sudo + builder user)
        run: |
          pacman -Syu --noconfirm sudo git base-devel chezmoi
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Full setup as builder (real pacman + paru/AUR)
        env:
          GITHUB_TOKEN: ${{ github.token }} # mise version lookups rate-limit without it
        run: |
          chown -R builder: "$PWD"
          sudo -u builder env HOME=/home/builder CI=true GITHUB_TOKEN="$GITHUB_TOKEN" chezmoi init \
            --source "$PWD" \
            --promptBool "work machine (render 1Password git identity)=false" \
            --apply
      - name: Verify the machine actually works
        # TMPDIR must share a mount with the checkout: doctor's hardlink
        # check links from the source dir into TMPDIR, and /tmp is on the
        # container fs while the workspace is a Docker volume.
        run: |
          tmp="$(dirname "$PWD")/tmp"
          mkdir -p "$tmp" && chown builder: "$tmp"
          sudo -u builder env HOME=/home/builder TMPDIR="$tmp" sh -c '
            set -e
            chezmoi doctor
            chezmoi verify --exclude scripts
            fish -c "echo fish boots"
            fish -n ~/.config/fish/config.fish
            tmux -L ci -f ~/.config/tmux/tmux.conf start-server \; kill-server
            ~/.local/bin/theme --current
            ~/.local/bin/dots-keys --raw | tail -3
          '
