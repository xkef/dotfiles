name: CI

# lint runs the portable subset of `mise run lint`. The Neovim check needs
# installed plugins and stays local. check runs `mise run check`, which
# deploys the repo into a throwaway HOME and asserts the result, a fast
# signal on every push. e2e-macos and e2e-arch run the real thing:
# setup/deploy with its hooks, so packages install, macos-defaults applies,
# and the resulting shell starts. The package install skips casks and Arch
# GUI packages under CI.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish
      - name: Shellcheck
        run: mise run lint-sh
      - name: Fish syntax
        run: mise run lint-fish
      - name: Markdown format
        run: mise run lint-fmt
      - name: Markdown lint
        run: mise run lint-md
      - name: Prose lint
        run: mise run lint-prose

  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install fish
        run: if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y fish; else brew install fish; fi
      - name: Apply into throwaway HOME
        run: mise run check

  e2e-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Full setup (files + hooks)
        env:
          GITHUB_TOKEN: ${{ github.token }} # mise version lookups rate-limit without it
        # A fresh Mac runs the README one-liner from a shell that predates
        # Homebrew, so PATH has no /opt/homebrew/bin. Reproduce that. The
        # hooks must find the tools they install on their own. --force
        # replaces the files the runner image ships in their place.
        run: env PATH=/usr/bin:/bin:/usr/sbin:/sbin setup/deploy --force --noconfirm
      - name: Verify the machine actually works
        run: |
          setup/deploy --dry-run
          fish -c 'echo fish boots'
          for f in ~/.config/fish/config.fish ~/.config/fish/conf.d/*.fish ~/.config/fish/functions/*.fish; do fish -n "$f"; done
          ~/.local/bin/theme --current
          ~/.local/bin/dots-keys --raw | tail -3

  e2e-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Bootstrap container (sudo + builder user)
        run: |
          pacman -Syu --noconfirm sudo git base-devel
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Full setup as builder (real pacman + paru/AUR)
        env:
          GITHUB_TOKEN: ${{ github.token }} # mise version lookups rate-limit without it
        run: |
          chown -R builder: "$PWD"
          sudo -u builder env HOME=/home/builder CI=true GITHUB_TOKEN="$GITHUB_TOKEN" setup/deploy --force --noconfirm
      - name: Verify the machine actually works
        run: |
          sudo -u builder env HOME=/home/builder sh -c '
            set -e
            setup/deploy --dry-run
            fish -c "echo fish boots"
            for f in ~/.config/fish/config.fish ~/.config/fish/conf.d/*.fish ~/.config/fish/functions/*.fish; do fish -n "$f"; done
            ~/.local/bin/theme --current
            ~/.local/bin/dots-keys --raw | tail -3
          '
