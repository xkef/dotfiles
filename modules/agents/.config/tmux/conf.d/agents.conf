# ── Agents ────────────────────────────────────────────
# Every coding agent across tmux sessions. Claude Code reports state from a
# hook and pi from an extension. Both inherit TMUX_PANE from the pane the
# agent runs in, which maps the state back to its pane. The binding runs
# through `fish -c` so conf.d builds PATH.

# @key tmux :: a :: Agent picker (all sessions)
bind a display-popup -w 90% -h 85% -E "fish -c agents"
