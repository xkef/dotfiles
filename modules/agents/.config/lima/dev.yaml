# Linux dev VM on Apple Silicon: Arch with the same dotfiles setup as every
# other machine.
#
#   limactl start --name=dev ~/.config/lima/dev.yaml   create and boot
#   limactl shell dev                                  shell in the guest
#   ssh lima-dev                                       plain SSH
#   limactl delete --force dev                         throw it away
#
# Provisioning outlasts the default 10-minute start timeout, so pass
# --timeout=30m to `limactl start`.
#
# The guest sees this repo read-only, at the host's path, and holds no
# host credentials. `lima-agent` copies other repositories in through git,
# to their host paths, so `limactl shell` opens in the current directory.
# Symlinks under the guest home point at the mounts. Lima forwards the
# guest's ports to localhost.
minimumLimaVersion: 2.0.0

# Weekly build from https://github.com/xkef/archlinux-lima, pinned to the
# release the setup was last tested with. Bump the tag to update.
images:
  - location: https://github.com/xkef/archlinux-lima/releases/download/v20260925-2/archlinux-aarch64.qcow2
    arch: aarch64

vmType: vz
memory: 8GiB

mountType: virtiofs
mounts:
  - location: ~/dotfiles
  # Images that Cmd-V pastes into VM panes as paths.
  - location: ~/.cache/lima-clipboard
  # Agent hooks in the guest report to the host's `mux-agents` picker.
  - location: ~/.local/state/agents
    mountPoint: "{{.Home}}/.local/state/agents"
    writable: true
  # Guest transcripts land on the host, where `agent-trace` reads them
  # beside the host's own.
  - location: ~/.local/state/agents/lima-dev/claude-projects
    mountPoint: "{{.Home}}/.claude/projects"
    writable: true

# The dotfiles expect /home/<user>, not Lima's default /home/<user>.guest.
# `limactl shell` starts user.shell, not the login shell, and the image
# ships fish for it.
user:
  home: "/home/{{.User}}"
  shell: /usr/bin/fish

# setup/deploy installs the packages and sets fish as the login shell.
# `lima-agent` runs Claude Code in here.
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      pacman -Syu --noconfirm --needed git
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      for mount in $(findmnt -t virtiofs -n -o TARGET); do
        case "$mount" in "$HOME"/*) continue ;; esac
        ln -sfn "$mount" "$HOME/$(basename "$mount")"
      done
      curl -fsSL https://claude.ai/install.sh | bash -s -- latest
      "$HOME/dotfiles/setup/deploy" --force --noconfirm
