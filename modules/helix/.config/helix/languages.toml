# ── Language servers ─────────────────────────────────
# See https://docs.helix-editor.com/languages.html

# ── Java, jdtls as in the nvim config ───────────────
[[language]]
name = "java"
auto-format = true

# ── Python ──────────────────────────────────────────
[[language]]
name = "python"
auto-format = true

# ── TypeScript / JavaScript ─────────────────────────
[[language]]
name = "typescript"
auto-format = true

[[language]]
name = "javascript"
auto-format = true

# ── Lua ─────────────────────────────────────────────
[[language]]
name = "lua"
auto-format = true
formatter = { command = "stylua", args = ["-"] }

# ── TOML ────────────────────────────────────────────
[[language]]
name = "toml"
auto-format = true
formatter = { command = "taplo", args = ["fmt", "-"] }

# ── Markdown ────────────────────────────────────────
[[language]]
name = "markdown"
auto-format = true
formatter = { command = "dprint", args = ["fmt", "--stdin", "md"] }

# ── Rust ────────────────────────────────────────────
# rust-analyzer runs from stable, whatever toolchain the project pins. A
# pin without the rust-analyzer component still gets a language server.
[language-server.rust-analyzer]
command = "rustup"
args = ["run", "stable", "rust-analyzer"]
