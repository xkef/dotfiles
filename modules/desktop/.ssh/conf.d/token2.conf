# ── FIDO2 security keys ────────────────────────────────
# One key per token, primary and backup, without a resident credential.
# The key files hold only a handle that works with the token, and the
# private archive carries them to each desktop.
#
# With a key file and a token plugged in, GitHub sees only the token
# keys. Without IdentitiesOnly, ssh offers the 1Password agent's key
# first, and GitHub accepts it. Otherwise GitHub falls back to 1Password.
Match host github.com exec "test -e %d/.ssh/id_ed25519_sk_primary -o -e %d/.ssh/id_ed25519_sk_backup && %d/.local/bin/token2-present"
    IdentitiesOnly yes
    IdentityFile ~/.ssh/id_ed25519_sk_primary
    IdentityFile ~/.ssh/id_ed25519_sk_backup
