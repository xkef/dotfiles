# ═══ [ui] ═══════════════════════════════════════════
[ui]
default-command = "log"
conflict-marker-style = "git"
merge-editor = "vimdiff"
diff-instructions = false
graph.style = "square"
log-word-wrap = true
show-cryptographic-signatures = true

# Only fish exports NVIM_APPNAME, so each editor names the config.
[ui.editor]
command = ["nvim"]
env.NVIM_APPNAME = "lazyvim"

# DiffEditor comes from hunk.nvim in LazyVim.
[ui.diff-editor]
command = ["nvim", "-c", "DiffEditor $left $right $output"]
env.NVIM_APPNAME = "lazyvim"

# ═══ [merge-tools] ══════════════════════════════════
# A merge tool takes no env, so `env` names the config. The args are
# jj's vimdiff defaults.
[merge-tools.vimdiff]
program = "env"
edit-args = ["NVIM_APPNAME=lazyvim", "nvim", "-f", "-d", "$left", "$right"]
merge-args = [
  "NVIM_APPNAME=lazyvim",
  "nvim",
  "-f",
  "-d",
  "$output",
  "-M",
  "$left",
  "$base",
  "$right",
  "-c",
  "wincmd J",
  "-c",
  "set modifiable",
  "-c",
  "set write",
  "-c",
  "/<<<<<</+2",
]

# ═══ [[--scope]] pager ══════════════════════════════
# Delta applies only to commands that produce diffs, so it can't mangle
# the output of status or bookmark list. Delta parses only git format
# diffs and passes jj's default color-words format through as is.
[[--scope]]
--when.commands = ["diff", "show", "log"]
[--scope.ui]
pager = "delta"
diff-formatter = ":git"

# ═══ [colors] ═══════════════════════════════════════
[colors]
"diff removed token" = { reverse = true, underline = false }
"diff added token" = { reverse = true, underline = false }

# ═══ [git] ══════════════════════════════════════════
[git]
private-commits = 'description(glob:"wip:*") | description(glob:"private:*")'

# ═══ [snapshot] ═════════════════════════════════════
[snapshot]
auto-update-stale = true
max-new-file-size = "2MiB"

# ═══ [signing] ══════════════════════════════════════
# Name, email, SSH signing, and the accounts by directory come from
# conf.d/identity.toml, which setup/private/decrypt writes.
[signing.backends.ssh]
allowed-signers = "~/.config/git/allowed_signers"

# ═══ [revsets] ══════════════════════════════════════
[revsets]
log = 'stack(mine() | @) | trunk()'
# `jj tug` targets the completed change under the empty working copy.
bookmark-advance-to = '@-'

# ═══ [revset-aliases] ═══════════════════════════════
[revset-aliases]
# Other authors' unmerged commits count as immutable. A stack on a
# colleague's branch then can't rewrite their commits, and log and
# stack() stop pulling them and their merges in.
'immutable_heads()' = 'builtin_immutable_heads() | (trunk().. & ~mine())'
'stack()' = 'stack(@)'
'stack(x)' = 'ancestors(reachable(x, mutable()), 2)'

# ═══ [template-aliases] ═════════════════════════════
[template-aliases]
# Show a GitHub noreply email as its username:
# 583231+octocat@users.noreply.github.com becomes octocat.
'format_short_signature(signature)' = '''
stringify(signature.email()).replace(regex:'^(?:\d+\+)?([^@]+)@users\.noreply\.github\.com$', "$1")
'''

# ═══ [aliases] ══════════════════════════════════════
[aliases]
# Inspect
examine = ["log", "-T", "builtin_log_detailed", "-p", "-r"]
credit = ["file", "annotate"]
cat = ["file", "show"]
# Structural diffs through difftastic. jj's built-in difft tool passes
# the terminal width.
dft = ["diff", "--tool", "difft"]
sft = ["show", "--tool", "difft"]

# Move changes
consume = ["squash", "--into", "@", "--from"]
eject = ["squash", "--from", "@", "--into"]
streamline = ["simplify-parents"]
tug = ["bookmark", "advance"]

# Rebase onto trunk
nt = ["new", "trunk()"]
retrunk = ["rebase", "-o", "trunk()"]
reheat = ["rebase", "-o", "trunk()", "-s", "roots(trunk()..stack())"]
# Fetch, then move every mutable stack that sits on trunk history onto
# the new trunk. A stack on an unmerged colleague branch stays put until
# that branch merges into trunk. The trailing "" fills $0, so the
# alias's own arguments land in "$@".
sync = [
  "util",
  "exec",
  "--",
  "sh",
  "-c",
  """
jj git fetch "$@" && jj rebase -o 'trunk()' -s 'roots(trunk()..mutable()) & children(::trunk())'
""",
  "",
]
