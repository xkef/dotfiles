# tinty switches the color scheme of every app at once. `theme` wraps it.
# Apps that use ANSI colors, such as fish, tv, bat, starship, and eza,
# follow the terminal and need no entry.
# See https://github.com/tinted-theming/tinty/blob/main/USAGE.md
default-scheme = "base24-catppuccin-frappe"

# Neovim reads current_scheme on focus. This recolors running instances
# right away.
hooks = ["~/.config/tinted-theming/tinty/nvim-theme"]

# WezTerm loads repos/tinted-terminal/themes/wezterm/<scheme>.toml for a
# scheme without a built-in match, and reloads when the current scheme
# changes. The hook derives the pi theme from the same file.
[[items]]
name = "tinted-terminal"
path = "https://github.com/tinted-theming/tinted-terminal"
themes-dir = "themes/wezterm"
supported-systems = ["base16", "base24"]
hook = "~/.config/tinted-theming/tinty/pi-theme %f"

# ~/.config/git/config includes the generated file.
[[items]]
name = "tinted-delta"
path = "https://github.com/tinted-theming/tinted-delta"
themes-dir = "configs"
supported-systems = ["base16", "base24"]
