# jj's compact log with the lines each change adds and removes, as +12 -3,
# at the end of the header. `jj log` keeps the built-in template.
[revisions]
template = '''
if(root,
  format_root_commit(self),
  label(
    separate(" ",
      if(current_working_copy, "working_copy"),
      if(immutable, "immutable", "mutable"),
      if(conflict, "conflicted"),
    ),
    concat(
      separate(" ",
        format_short_commit_header(self),
        if(!empty,
          label("diff added", "+" ++ diff.stat().total_added()) ++ " "
            ++ label("diff removed", "-" ++ diff.stat().total_removed())
        ),
      ) ++ "\n",
      separate(" ",
        if(empty, empty_commit_marker),
        if(description,
          description.first_line(),
          label(if(empty, "empty"), description_placeholder),
        ),
      ) ++ "\n",
    ),
  )
)
'''

# The preview runs jj without a pager or a terminal. Pipe jj's git format
# diff through delta, sized to the preview pane, so it renders as `jj diff`
# does in the terminal. --stat heads the diff with lines added and removed.
# jjui runs only jj, so `jj util exec` starts the shell. jjui quotes $file as
# a fileset.
[preview]
revision_command = [
  "util",
  "exec",
  "--",
  "sh",
  "-c",
  'jj show --color=always --stat --git -r "$1" | delta --paging=never --width="$2"',
  "sh",
  "$change_id",
  "$preview_width",
]
file_command = [
  "util",
  "exec",
  "--",
  "sh",
  "-c",
  'jj diff --color=always --stat --git -r "$1" "$3" | delta --paging=never --width="$2"',
  "sh",
  "$change_id",
  "$preview_width",
  "$file",
]

# t opens the selected revision, or the selected file in the details
# view, in difftastic through `jj dft`. less drops -F and -X from $LESS so
# a short diff stays open until q instead of vanishing behind jjui.
[[actions]]
name = "difftastic"
lua = '''
local args = {
  "dft", "-r", context.change_id(),
  "--config", 'ui.pager=["less", "-R", "-+F", "-+X"]',
}
local file = context.file()
if file then
  table.insert(args, string.format("file:%q", file))
end
jj_interactive(args)
'''

[[bindings]]
action = "difftastic"
key = "t"
scope = "revisions"
desc = "difftastic"

[[bindings]]
action = "difftastic"
key = "t"
scope = "revisions.details"
desc = "difftastic"

# Alt-Shift-hjkl resizes the preview, as in Neovim, tmux, and WezTerm.
# H and K grow it, L and J shrink it, so the keys follow the border with
# the preview on the right or at the bottom. Ctrl-h and Ctrl-l move
# between panes everywhere else, so the no-op action takes them back from
# jjui's resize. A later binding of a key wins. Each key has three names,
# since terminals encode Alt-Shift-H as ESC H, a kitty key, or tmux's
# CSI u, and jjui names those alt+shift+h, alt+H, or alt+shift+H.
[[actions]]
name = "noop"
lua = "-- does nothing"

[[bindings]]
action = "noop"
key = ["ctrl+h", "ctrl+l"]
scope = "ui.preview"

[[bindings]]
action = "ui.preview_expand"
key = [
  "alt+shift+h",
  "alt+H",
  "alt+shift+H",
  "alt+shift+k",
  "alt+K",
  "alt+shift+K",
]
scope = "ui.preview"
desc = "expand preview"

[[bindings]]
action = "ui.preview_shrink"
key = [
  "alt+shift+l",
  "alt+L",
  "alt+shift+L",
  "alt+shift+j",
  "alt+J",
  "alt+shift+J",
]
scope = "ui.preview"
desc = "shrink preview"
