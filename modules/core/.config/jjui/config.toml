# The preview runs jj without a pager or a terminal. Pipe jj's git format
# diff through delta, sized to the preview pane, so it renders as `jj diff`
# does in the terminal. jjui runs only jj, so `jj util exec` starts the
# shell. jjui quotes $file as a fileset.
[preview]
revision_command = [
  "util",
  "exec",
  "--",
  "sh",
  "-c",
  'jj show --color=always --git -r "$1" | delta --paging=never --width="$2"',
  "sh",
  "$change_id",
  "$preview_width",
]
file_command = [
  "util",
  "exec",
  "--",
  "sh",
  "-c",
  'jj diff --color=always --git -r "$1" "$3" | delta --paging=never --width="$2"',
  "sh",
  "$change_id",
  "$preview_width",
  "$file",
]

# t opens the selected revision, or the selected file in the details
# view, in difftastic through `jj dft`. less drops -F and -X from $LESS so
# a short diff stays open until q instead of vanishing behind jjui.
[[actions]]
name = "difftastic"
lua = '''
local args = {
  "dft", "-r", context.change_id(),
  "--config", 'ui.pager=["less", "-R", "-+F", "-+X"]',
}
local file = context.file()
if file then
  table.insert(args, string.format("file:%q", file))
end
jj_interactive(args)
'''

[[bindings]]
action = "difftastic"
key = "t"
scope = "revisions"
desc = "difftastic"

[[bindings]]
action = "difftastic"
key = "t"
scope = "revisions.details"
desc = "difftastic"
