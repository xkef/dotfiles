# Entry point. conf.d/*.conf holds all configuration, sourced in lexical
# order. Each file defines what it needs, so the names describe content
# instead of a load order, and packages can drop fragments into conf.d
# without picking a position. -q suppresses the error when no file matches,
# as on a fresh install.
#
# The config targets tmux 3.8: floating and modal panes, the theme option,
# switch-mode, and the OSC 133 pane formats. An older tmux skips each
# unknown option, but an unknown command or flag inside a binding drops the
# rest of its file.
source-file -q ~/.config/tmux/conf.d/*.conf

# Per-machine overrides, untracked.
source-file -q ~/.config/tmux/local.conf
