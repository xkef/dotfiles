# This file appends to these array options. Resetting them first keeps a
# reload from repeating the entries.
set -su terminal-features
set -gu update-environment

# ── Terminal capabilities ────────────────────────────
# tmux-256color is the terminfo entry with 256 colors and italics. tmux
# also detects RGB from COLORTERM, which SSH drops, so declare it for the
# outer terminals by name.
# See https://github.com/tmux/tmux/wiki/FAQ#how-do-i-use-rgb-colour
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB,alacritty:RGB,xterm-kitty:RGB"

# Forward CSI u modified keys such as Ctrl-Shift-A to apps inside tmux that
# ask for them. Don't force extkeys on the outer terminal with
# `terminal-features 'xterm*:extkeys'`. That puts some terminals, Ghostty
# among them, into modifyOtherKeys mode 2, whose encoder translates shifted
# digit keys through a US layout. On Swiss German, Shift+3 (*) arrives as #
# and Shift+0 (=) as ), which breaks prefix bindings and typing.
# See https://github.com/tmux/tmux/wiki/Modifier-Keys
set -s extended-keys on
set -s extended-keys-format csi-u

# usstyle enables curly, dotted, dashed, and colored underlines, which
# neovim diagnostics and git signs use. sync enables synchronized output,
# which reduces flicker on fast updates.
set -as terminal-features ',*:usstyle'
set -as terminal-features ',*:sync'

# tmux stores OSC 8 hyperlinks, such as delta's file links, and re-emits
# them to terminals with the hyperlinks feature. It detects Ghostty,
# WezTerm, and iTerm2 from their version reply, but not kitty or
# Alacritty. Terminals without OSC 8 ignore the sequence.
set -as terminal-features ',*:hyperlinks'

# ── Clipboard ────────────────────────────────────────
# set-clipboard on writes copies to the system clipboard over OSC 52, and
# lets programs in a pane do the same, which works from remote sessions.
# get-clipboard request answers a program's OSC 52 read, such as a neovim
# paste, with the outer terminal's clipboard instead of the newest tmux
# buffer, so text copied outside the terminal pastes too.
set -s set-clipboard on
set -s get-clipboard request

# ── General options ──────────────────────────────────
set -ga update-environment PATH     # inherit PATH from the attaching shell
set -g history-limit 50000
set -g detach-on-destroy no-detached # switch to another session instead of detaching
set -g display-time 4000
set -g status-interval 5
set -g focus-events on              # neovim uses FocusGained and FocusLost
set -g allow-passthrough on         # OSC sequences for themes and images reach the terminal
set -sg escape-time 0               # no delay after Escape, which vim needs
set -g base-index 1                 # 0 sits far from the prefix key
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on        # resize to the smallest client viewing the window

# Command prompt history, including copy-mode searches, survives a server
# restart. tmux doesn't create the directory.
run-shell 'mkdir -p ~/.local/state/tmux'
set -s history-file ~/.local/state/tmux/history

# ── Prefix key ───────────────────────────────────────
# Ctrl-Space, the WezTerm leader, so the bindings carry over. tmux runs
# where WezTerm doesn't, never inside it. Pairing the prefix with the
# Neovim leader, Space, after wincent, lets one physical key serve both.
# Ctrl-A and Ctrl-B stay free for readline.
# See https://github.com/wincent/wincent
unbind C-b
set -g prefix C-Space

# @key tmux-windows :: Ctrl-Space :: Last window (double-tap)
bind C-Space last-window
