# ── Keybindings ───────────────────────────────────────
# Every binding follows the prefix key unless noted. The keys match the
# WezTerm leader table in ~/.config/wezterm/leader.lua.
# `bind -r` makes a binding repeatable within repeat-time, default 500ms,
# without pressing the prefix again. See "KEY BINDINGS" in man tmux.

# @key tmux :: r :: Reload config
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display "Config reloaded"

# @key tmux :: Ctrl-l :: Clear scrollback
bind C-l clear-history

# ── Pane navigation across tmux and neovim ───────────
# When the active pane runs neovim or tv, send-keys forwards the key so
# smart-splits.nvim handles the move across splits. Otherwise tmux selects
# the adjacent pane. The is_vim check reads the foreground process name
# with ps on the pane's tty and matches vim, nvim, view, vimdiff, and tv.
# See https://github.com/mrjones2014/smart-splits.nvim#tmux
#
# @key tmux :: h/j/k/l :: Navigate panes (and Neovim splits)
# Unbind bare C-hjkl first. These bindings use prefix+hjkl, which leaves
# C-hjkl free for shell line editing, such as Ctrl-H for backspace.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|tv)(diff)?$'"
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
bind h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# @key tmux :: H/J/K/L :: Resize pane (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Panes ────────────────────────────────────────────
# @key tmux :: | / - :: Split right / down
# -c "#{pane_current_path}" makes a new pane or window inherit the current
# directory instead of the directory tmux started in.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# @key tmux :: z :: Toggle pane zoom
bind z resize-pane -Z
# @key tmux :: x :: Close pane
bind x confirm-before -p "kill pane? (y/n)" kill-pane
# @key tmux :: q :: Jump to a pane by label
bind q display-panes
# @key tmux :: m :: Swap the pane with a labeled one
bind m display-panes "swap-pane -t '%%'"

# ── Windows ──────────────────────────────────────────
# @key tmux :: c :: New window
bind c new-window -c "#{pane_current_path}"
# @key tmux :: n / p :: Next / previous window (repeatable)
bind -r n next-window
bind -r p previous-window
# @key tmux :: Tab :: Last window
bind Tab last-window
# @key tmux :: < / > :: Move window left / right (repeatable)
# -d keeps focus on the moved window
bind -r '<' swap-window -d -t '{previous}'
bind -r '>' swap-window -d -t '{next}'

# @key tmux :: w :: Switch window, all sessions
# Each line reads "session:index window_name". cut extracts the target.
bind w display-popup -E -w 60% -h 60% "\
  tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | \
  fzf --reverse --header 'switch window' | \
  cut -d' ' -f1 | \
  xargs tmux switch-client -t"

# ── Sessions ─────────────────────────────────────────
# sesh creates and switches sessions by project through zoxide, as the
# WezTerm workspace picker does for workspaces. Bindings run through
# `fish -c` so conf.d builds PATH independent of the tmux server's
# environment, which may predate a fresh install.
# See https://github.com/joshmedeski/sesh

# @key tmux :: f :: Session picker (sesh)
bind f run-shell "fish -c tmux-sesh"
# @key tmux :: F :: Last session
bind F run-shell "fish -c 'sesh last || tmux display-message \"No previous session\"'"
# @key tmux :: S :: New named session
bind S command-prompt -p "New session:" "new-session -s '%%'"
# @key tmux :: s :: Browse sessions
bind s choose-tree -Zs

# ── Tools ────────────────────────────────────────────
# A floating pane (tmux 3.7+) is a real pane above the layout, centered at
# 80%: -x/-y set the size, -X/-Y the offset, (100-80)/2 = 10%. Unlike
# display-popup, which is modal and closes when its command exits, it
# persists while you work in the tiled panes beneath it. Resize with
# H/J/K/L, zoom with z, move it with the mouse, close it with exit.

# @key tmux :: * :: Floating shell
bind * new-pane -c "#{pane_current_path}" -x 80% -y 80% -X 10% -Y 10%
# @key tmux :: e :: File manager (yazi)
bind e new-pane -c "#{pane_current_path}" -x 80% -y 80% -X 10% -Y 10% yazi
# @key tmux :: g :: Lazygit
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E lazygit
# @key tmux :: G :: jj UI (jjui)
bind G new-pane -c "#{pane_current_path}" -x 80% -y 80% -X 10% -Y 10% jjui
# @key tmux :: R :: Search and replace (scooter)
bind R display-popup -d "#{pane_current_path}" -w 90% -h 90% -E scooter
# @key tmux :: d :: Lazydocker
bind d display-popup -d "#{pane_current_path}" -w 90% -h 90% -E lazydocker
# @key tmux :: ? :: This reference
bind ? display-popup -w 70% -h 85% -E dots-keys

# ── Scrollback ───────────────────────────────────────
# Jump between shell prompts in scrollback through OSC 133 prompt marks.
# See https://github.com/tmux/tmux/wiki/FAQ#how-do-i-jump-between-prompts
# @key tmux :: o / i :: Jump to previous / next prompt
bind o { copy-mode; send-keys -X previous-prompt }
bind i { copy-mode; send-keys -X next-prompt }
bind -T copy-mode-vi -r o { send-keys -X previous-prompt }
bind -T copy-mode-vi -r i { send-keys -X next-prompt }
