# ── Keybindings ───────────────────────────────────────
# Every binding follows the prefix key unless noted. The keys match the
# WezTerm leader table in ~/.config/wezterm/leader.lua, except that the
# prefix twice switches to the last window instead of sending the prefix,
# floating panes add @ and M, and W and P move panes between windows.
# `bind -r` makes a binding repeatable within repeat-time, default 500ms,
# without pressing the prefix again. A binding that matches a tmux default
# carries only its @key line, for the reference. See "KEY BINDINGS" in man
# tmux.

# @key tmux :: r :: Reload config
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display "Config reloaded"

# @key tmux-scroll :: Ctrl-l :: Clear scrollback
bind C-l clear-history

# ── Pane navigation across tmux and neovim ───────────
# When the active pane runs neovim, send-keys forwards the key so
# smart-splits.nvim handles the move across splits. Otherwise tmux selects
# the adjacent pane. smart-splits.nvim sets the @pane-is-vim pane option
# while it runs, as it sets the IS_NVIM user var that WezTerm's leader reads.
# See https://github.com/mrjones2014/smart-splits.nvim/tree/v2.1.1-final#tmux
#
# @key tmux-panes :: h/j/k/l :: Navigate panes (and Neovim splits)
# Unbind bare C-hjkl first. These bindings use prefix+hjkl, which leaves
# C-hjkl free for shell line editing, such as Ctrl-H for backspace.
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
bind h if-shell -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind j if-shell -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind k if-shell -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind l if-shell -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

# @key tmux-panes :: H/J/K/L :: Resize pane (and Neovim splits, repeatable)
# In neovim, the key goes on as Alt-Shift-hjkl, which smart-splits.nvim
# resizes with, as h/j/k/l go on as Ctrl-hjkl. A tiled pane moves its
# border in the direction. A floating pane moves its bottom-right corner,
# since its top-left corner stays put.
bind -r H if-shell -F "#{@pane-is-vim}" 'send-keys M-H' {
  if-shell -F '#{pane_floating_flag}' 'resize-pane -R -5' 'resize-pane -L 5'
}
bind -r J if-shell -F "#{@pane-is-vim}" 'send-keys M-J' 'resize-pane -D 5'
bind -r K if-shell -F "#{@pane-is-vim}" 'send-keys M-K' {
  if-shell -F '#{pane_floating_flag}' 'resize-pane -D -5' 'resize-pane -U 5'
}
bind -r L if-shell -F "#{@pane-is-vim}" 'send-keys M-L' 'resize-pane -R 5'

# ── Panes ────────────────────────────────────────────
# @key tmux-panes :: | / - :: Split right / down
# -c "#{pane_current_path}" makes a new pane or window inherit the current
# directory instead of the directory tmux started in.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# @key tmux-panes :: z :: Toggle pane zoom
# @key tmux-panes :: x :: Close pane
# @key tmux-panes :: q :: Jump to a pane by label
# @key tmux-panes :: m :: Swap the pane with a labeled one
bind m display-panes "swap-pane -t '%%'"
# @key tmux-panes :: T :: Rename the pane
# @key tmux-panes :: ; :: Last pane
# @key tmux-panes :: { / } :: Swap the pane with the previous / next
# @key tmux-panes :: Ctrl-o / Alt-o :: Rotate panes forward / backward
# @key tmux-panes :: Space :: Next layout
# @key tmux-panes :: Alt-1 to Alt-7 :: Preset layout (even, main, tiled)
# @key tmux-panes :: Arrows :: Select pane
# @key tmux-panes :: Ctrl/Alt-Arrows :: Resize pane by 1 / 5 cells

# @key tmux-panes :: ! :: Break the pane into a new window
# @key tmux-panes :: W :: Move the pane to a chosen window
# @key tmux-panes :: P :: Pull a chosen pane into this window
# choose-tree replaces %% with the chosen target. join-pane is the reverse
# of break-pane.
bind W choose-tree -Zw "join-pane -t '%%'"
bind P choose-tree -Z "join-pane -s '%%'"

# ── Floating panes ───────────────────────────────────
# A floating pane is a real pane above the tiled layout. Unlike
# display-popup, which is modal and closes when its command exits, it
# persists while you work in the tiled panes beneath it. The mouse moves it
# by its border, a Ctrl-drag draws a new one, and H/J/K/L resize it. Its
# border shows the pane title. The bindings below center a pane at 80%:
# -x/-y set the size, -X/-Y the offset, (100-80)/2 = 10%. -A keeps it
# visible above a zoomed pane.

# @key tmux-float :: * :: Floating shell
bind * new-pane -A -c "#{pane_current_path}" -x 80% -y 80% -X 10% -Y 10%
# @key tmux-float :: @ :: Float or tile the pane
# @key tmux-float :: M :: Move the floating pane (hjkl, c, 1-4, 0)
# The move table holds tmux's defaults: arrows to an edge, 1-4 to a
# corner, 0 to fill the window, and , or . for a menu. hjkl nudge the pane
# and repeat, and c centers it.
bind M switch-client -T move
bind -T move -r h move-pane -L 4
bind -T move -r j move-pane -D 2
bind -T move -r k move-pane -U 2
bind -T move -r l move-pane -R 4
bind -T move c move-pane -P centre

# ── Windows ──────────────────────────────────────────
# @key tmux-windows :: c :: New window
bind c new-window -c "#{pane_current_path}"
# @key tmux-windows :: n / p :: Next / previous window (repeatable)
bind -r n next-window
bind -r p previous-window
# @key tmux-windows :: Tab :: Last window
bind Tab last-window
# @key tmux-windows :: < / > :: Move window left / right (repeatable)
# -d keeps focus on the moved window
bind -r '<' swap-window -d -t '{previous}'
bind -r '>' swap-window -d -t '{next}'

# @key tmux-windows :: w :: Switch window, all sessions
# switch-mode lists every window of every session and narrows the list by
# fuzzy match as you type. It runs in an empty floating pane that -k kills
# when the mode exits.
bind w {
  new-pane -E -x 60% -y 40% -X 20% -Y 30%
  switch-mode -w -k
}
# @key tmux-windows :: 1 to 9 :: Select window
# @key tmux-windows :: ' :: Select window by index
# @key tmux-windows :: . :: Move window to index
# @key tmux-windows :: , :: Rename window
# @key tmux-windows :: & :: Close window
# @key tmux-windows :: Alt-n / Alt-p :: Next / previous window with an alert
# @key tmux-sessions :: BTab :: Switch session, fuzzy (tmux default)

# ── Sessions ─────────────────────────────────────────
# sesh creates and switches sessions by project through zoxide, as the
# WezTerm workspace picker does for workspaces. Bindings run through
# `fish -c` so conf.d builds PATH independent of the tmux server's
# environment, which may predate a fresh install.
# See https://github.com/joshmedeski/sesh

# @key tmux-sessions :: f :: Session picker (tv, sesh)
# The tmux-sessions tv channel connects on Enter and kills on Ctrl-W.
bind f display-popup -E -w 80% -h 70% "fish -c 'tv tmux-sessions --no-remote'"
# @key tmux-sessions :: F :: Last session
bind F run-shell "fish -c 'sesh last || tmux display-message \"No previous session\"'"
# @key tmux-sessions :: S :: New named session
bind S command-prompt -p "New session:" "new-session -s '%%'"
# @key tmux-sessions :: s :: Browse sessions
# @key tmux-sessions :: ( / ) :: Previous / next session
# @key tmux-sessions :: $ :: Rename session
# @key tmux-sessions :: D :: Detach a chosen client
# @key tmux-sessions :: Ctrl-z :: Suspend the client

# ── Tools ────────────────────────────────────────────
# yazi and jjui open in floating panes, so they stay open beside the work.
# lazygit, scooter, and lazydocker open in a modal pane, which keeps the
# focus until the program exits, as a popup does, but as a real pane it
# handles every escape sequence a pane does, where a popup handles a
# subset. -T titles the pane border. set -p acts on the new pane: when its
# program fails, the pane stays open with the error until a key press.

# @key tmux-tools :: e :: File manager (yazi)
bind e {
  new-pane -A -c "#{pane_current_path}" -x 80% -y 80% -X 10% -Y 10% -T yazi yazi
  set -p remain-on-exit failed-key
}
# @key tmux-tools :: G :: jj UI (jjui)
bind G {
  new-pane -A -c "#{pane_current_path}" -x 80% -y 80% -X 10% -Y 10% -T jjui jjui
  set -p remain-on-exit failed-key
}
# @key tmux-tools :: g :: Lazygit
bind g {
  new-pane -O -c "#{pane_current_path}" -x 90% -y 90% -X 5% -Y 5% -T lazygit lazygit
  set -p remain-on-exit failed-key
}
# @key tmux-tools :: R :: Search and replace (scooter)
bind R {
  new-pane -O -c "#{pane_current_path}" -x 90% -y 90% -X 5% -Y 5% -T scooter scooter
  set -p remain-on-exit failed-key
}
# @key tmux-tools :: d :: Lazydocker
bind d {
  new-pane -O -c "#{pane_current_path}" -x 90% -y 90% -X 5% -Y 5% -T lazydocker lazydocker
  set -p remain-on-exit failed-key
}
# @key tmux :: ? :: This reference
bind ? display-popup -w 70% -h 85% -E dots-ref
# @key tmux :: : :: Command prompt
# @key tmux :: ~ :: Show recent messages

# ── Scrollback ───────────────────────────────────────
# Jump between shell prompts in scrollback through OSC 133 prompt marks.
# copy-mode.conf binds o and i inside copy mode.
# @key tmux-scroll :: o / i :: Jump to previous / next prompt
bind o { copy-mode; send-keys -X previous-prompt }
bind i { copy-mode; send-keys -X next-prompt }
# @key tmux-scroll :: PageUp :: Enter copy mode, one page up
# @key tmux-scroll :: ] :: Paste the last copied buffer
# @key tmux-scroll :: = / # :: Choose / list paste buffers

# ── Links and hints ──────────────────────────────────
# tmux-links opens a file link in nvim at its line, and other links in
# the system opener. Option-click hands the link through the @clicked-link
# option, which avoids quoting the URI into a shell command. A click off a
# link goes to the pane as usual. tmux-hints copies a token from the
# screen, as WezTerm's quick select does. Both read the pane under the
# popup. Bindings run through `fish -c` for PATH and NVIM_APPNAME.

# @key tmux-scroll :: u :: Open a link from scrollback (tv)
bind u display-popup -E -w 90% -h 90% "fish -c tmux-links"
# @key tmux-scroll :: t :: Copy a path, hash, URL, or number from the screen (tv)
bind t display-popup -E -w 90% -h 90% "fish -c tmux-hints"
# @key tmux-scroll :: Option-click :: Open the clicked link (no prefix)
bind -n M-MouseDown1Pane if -F '#{mouse_hyperlink}' {
  set -gF @clicked-link '#{mouse_hyperlink}'
  display-popup -E -w 90% -h 90% "fish -c 'tmux-links --clicked'"
} {
  select-pane -t =
  send -M
}
