# ── Vi copy mode ─────────────────────────────────────
# Copy mode scrolls, searches, and selects text from the scrollback buffer.
# With mode-keys vi, hjkl moves, / searches, and v, V, and C-v select, as
# in vim. See "COPY MODE" in man tmux.

# ── Vim-mode state machine ───────────────────────────
# Mode constants for the visual selection state machine. They live here
# rather than in a separate file so conf.d load order doesn't matter. @mode
# holds the current state per pane, so two panes in copy mode keep their
# own. The global value is the default for a pane that never set it.
%hidden NORMAL=0
%hidden VISUAL=1
%hidden VISUAL_LINE=2
%hidden VISUAL_BLOCK=3
set -g @mode $NORMAL

setw -g mode-keys vi
setw -g status-keys vi

# Line numbers in copy mode: the current line absolute, the others
# relative, like vim's number plus relativenumber. Stays off when the mouse
# opens copy mode.
set -g copy-mode-line-numbers hybrid

# A scrollbar overlays the right edge while copy mode scrolls and hides
# after pane-scrollbars-timeout. It doesn't narrow or reflow the pane.
set -g pane-scrollbars modal

# The pane border shows the position, so drop the indicator that copy mode
# draws over the top-right corner of the text. P toggles it back.
setw -g copy-mode-position-format ""

# @key tmux-scroll :: Enter :: Enter copy mode
bind Enter copy-mode

# ── Search ───────────────────────────────────────────
# command-prompt -i updates results while typing. -I "#{pane_search_string}"
# prefills the last search term, and Up recalls older ones from the prompt
# history. -T search selects the "search" key table. -P draws the prompt
# at the bottom of the pane instead of on the status line, next to the
# matches. An all-lowercase term matches without case.
# See "COMMAND-PROMPT" in man tmux.
# @key tmux-scroll :: / :: Search forward (enters copy mode)
bind / {
  copy-mode
  command-prompt -P -i -I "#{pane_search_string}" -T search -p "(search down)" {
    send-keys -X search-forward-incremental "%%"
  }
}

# @key copy :: / / ? :: Search forward / backward
bind -T copy-mode-vi / command-prompt -P -i -I "#{pane_search_string}" -T search -p "(search down)" {
  send-keys -X search-forward-incremental "%%"
}
bind -T copy-mode-vi ? command-prompt -P -i -I "#{pane_search_string}" -T search -p "(search up)" {
  send-keys -X search-backward-incremental "%%"
}
# @key copy :: * / # :: Search word under cursor forward / backward (tmux default)
# @key copy :: : :: Go to line (tmux default)

# ── Visual selection state machine ───────────────────
# Vim-like v, V, and C-v toggling in copy mode. Each key cycles through
# modes. v in VISUAL returns to NORMAL and clears the selection. v in
# VISUAL_BLOCK switches to VISUAL. #{selection_present} reports an active
# selection. rectangle-on and rectangle-off switch between character and
# block selection. A block extends past the end of short lines, like vim's
# virtualedit=block. See "COPY MODE" in man tmux.

# @key copy :: v / V / Ctrl-v :: Visual / line / block selection
# v: toggle VISUAL and NORMAL, or switch from LINE or BLOCK to VISUAL
bind -T copy-mode-vi v if-shell -F '#{selection_present}' {
    if-shell -F '#{||:#{==:#{@mode},#{VISUAL_BLOCK}},#{==:#{@mode},#{VISUAL_LINE}}}' {
      send-keys -X rectangle-off
      set -p @mode $VISUAL
    } {
      send-keys -X rectangle-off
      send-keys -X clear-selection
      set -p @mode $NORMAL
    }
  } {
    send-keys -X rectangle-off
    send-keys -X begin-selection
    set -p @mode $VISUAL
  }

# V: toggle VISUAL_LINE and NORMAL, or switch from VISUAL or BLOCK to LINE
bind -T copy-mode-vi V if-shell -F '#{selection_present}' {
    if-shell -F '#{||:#{==:#{@mode},#{VISUAL}},#{==:#{@mode},#{VISUAL_BLOCK}}}' {
      send-keys -X rectangle-off
      send-keys -X select-line
      set -p @mode $VISUAL_LINE
    } {
      send-keys -X clear-selection
      set -p @mode $NORMAL
    }
  } {
    send-keys -X rectangle-off
    send-keys -X select-line
    set -p @mode $VISUAL_LINE
  }

# C-v: toggle VISUAL_BLOCK and NORMAL, or switch from VISUAL or LINE to BLOCK
bind -T copy-mode-vi C-v if-shell -F '#{selection_present}' {
    if-shell -F '#{||:#{==:#{@mode},#{VISUAL}},#{==:#{@mode},#{VISUAL_LINE}}}' {
      send-keys -X rectangle-on
      set -p @mode $VISUAL_BLOCK
    } {
      send-keys -X rectangle-off
      send-keys -X clear-selection
      set -p @mode $NORMAL
    }
  } {
    send-keys -X rectangle-on
    send-keys -X begin-selection
    set -p @mode $VISUAL_BLOCK
  }

# ── Yank ─────────────────────────────────────────────
# y copies the selection to the system clipboard over OSC 52, since
# set-clipboard is on, and leaves copy mode. Y copies to the end of the line.
# @key copy :: y / Y :: Yank selection / to end of line
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y   send-keys -X copy-end-of-line

# @key copy :: Escape :: Clear the selection, or leave copy mode
# As in vim, Escape leaves visual mode first, and a second Escape leaves
# copy mode.
bind -T copy-mode-vi Escape if-shell -F '#{selection_present}' {
    send-keys -X clear-selection
    send-keys -X rectangle-off
    set -p @mode $NORMAL
  } {
    send-keys -X cancel
    set -p @mode $NORMAL
  }
# @key copy :: q :: Leave copy mode
bind -T copy-mode-vi q { send-keys -X cancel; set -p @mode $NORMAL }

# ── Navigation ──────────────────────────────────────
# @key copy :: H / M / L :: Top / middle / bottom of screen (tmux default)
# @key copy :: Ctrl-u / d :: Half page up / down (tmux default)
# @key copy :: z :: Center the cursor line (tmux default)

# @key copy :: o / i :: Previous / next prompt, or o swaps selection ends
# Jump between shell prompts through OSC 133 prompt marks, which fish
# emits. While a selection is active, o moves the cursor to its other end,
# as in vim.
# See https://github.com/tmux/tmux/wiki/FAQ#how-do-i-jump-between-prompts
bind -T copy-mode-vi o if-shell -F '#{selection_present}' {
  send-keys -X other-end
} {
  send-keys -X previous-prompt
}
bind -T copy-mode-vi i send-keys -X next-prompt

# @key copy :: R :: Follow pane output (toggle)
# Copy mode freezes the pane content when it starts. refresh-toggle keeps
# it updating as the program writes, such as a build log, without losing
# the cursor. The pane border reads LIVE while it runs. r refreshes once.
bind -T copy-mode-vi R send-keys -X refresh-toggle

# ── Mouse integration ────────────────────────────────
# By default the end of a mouse drag copies and leaves copy mode. Stay in
# copy mode instead so the selection stays adjustable. A drag that starts
# on the selection resizes it.
unbind -T copy-mode-vi MouseDragEnd1Pane

# Scroll 3 lines at a time instead of the default 5. Clear any selection on
# scroll so it can't grow by accident.
bind -T copy-mode-vi WheelUpPane {
  select-pane
  send-keys -t'{mouse}' -X clear-selection
  send-keys -t'{mouse}' -X -N 3 scroll-up
  set -p -t'{mouse}' @mode $NORMAL
}
bind -T copy-mode-vi WheelDownPane {
  select-pane
  send-keys -t'{mouse}' -X clear-selection
  send-keys -t'{mouse}' -X -N 3 scroll-down
  set -p -t'{mouse}' @mode $NORMAL
}

# A mouse drag starts a character-wise visual selection. #{mouse_any_flag}
# reports that the program in the pane, such as vim or less, handles mouse
# events. Then send-keys -M forwards the event.
bind -T root MouseDrag1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" {
  send-keys -M
  send-keys -X rectangle-off
  set -p -t'{mouse}' @mode $VISUAL
} {
  copy-mode -M
  send-keys -X rectangle-off
  set -p -t'{mouse}' @mode $VISUAL
}

# The scroll wheel enters copy mode unless the pane already runs it, the
# pane's program handles the mouse, or the pane shows the alternate screen,
# which has no scrollback. -e leaves copy mode at the bottom.
bind -T root WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" {
  send-keys -M
  if-shell -F "#{pane_in_mode}" "send-keys -X rectangle-off"
  set -p -t'{mouse}' @mode $NORMAL
} {
  copy-mode -e
  send-keys -X rectangle-off
  set -p -t'{mouse}' @mode $NORMAL
}
