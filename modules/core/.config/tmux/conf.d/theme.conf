# ── Appearance ────────────────────────────────────────
# Every style uses an ANSI palette slot, colour0 to colour15, instead of a
# hex value, so tmux takes its colors from the outer terminal's palette and
# needs no per-theme config.
#
# ANSI slots. Values vary by theme, roles stay stable:
#   colour0  = dark bg    colour8  = bright black (dim/border)
#   colour1  = red        colour9  = bright red
#   colour2  = green      colour10 = bright green
#   colour3  = yellow     colour11 = bright yellow
#   colour4  = blue       colour12 = bright blue
#   colour5  = magenta    colour13 = bright magenta
#   colour6  = cyan       colour14 = bright cyan
#   colour7  = light bg   colour15 = bright white

# tmux paints its own modes, menus, popups, and line numbers with theme
# colors, a 256-color palette it picks by the light or dark mode the
# terminal reports. That renders wrong when the active palette doesn't
# match the OS appearance, such as a dark theme under a light-mode OS.
# terminal maps every theme color to an ANSI slot instead, so the styles
# this file leaves at their defaults follow the palette too.
set -g theme terminal

set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 80

# Highlight a window tab when it changes in the background, without a
# status message.
setw -g monitor-activity on
set -g visual-activity off

# ── Status bar ───────────────────────────────────────
# bg=default inherits the terminal background. The status line shows
# tmux-level info only: session, windows, CPU and memory, time, and host.
# Directory and git branch belong in the starship prompt.
set -g status-style "bg=default,fg=default"

# Left: session name in magenta, then a § separator, after wincent.
set -g status-left "#[fg=colour5,bold,italics]#S § #[default]"

# Right: a yellow Z when a pane is zoomed, CPU and memory from
# mux-sysstat, dim clock, and hostname.
set -g status-right "#{?window_zoomed_flag,#[fg=colour3]Z,#[fg=default] }  #(mux-sysstat --tmux)  #[fg=colour8]%H:%M  #[fg=colour6,bold]#h "

# ── Window tabs ──────────────────────────────────────
# tmux names each window after the running command. A tab reads
# " index:command ", and the active one uses bold blue reverse video. The
# format strings carry the spacing, so window-status-separator stays empty.
#
# A background tab whose last shell command failed ends in a red ✗.
# #{pane_command_status} holds the exit status of the window's active pane
# from the OSC 133 marks fish emits. It stays until the next command, so a
# failed build in another window shows without switching to it.
%hidden COMMAND_FAILED="#{&&:#{!:#{pane_command_running}},#{m/r:^[1-9],#{pane_command_status}}}"
setw -g automatic-rename on
setw -g window-status-format "  #[fg=colour8] #I:#W#{?$COMMAND_FAILED,#[fg=colour1] ✗,} #[default]"
setw -g window-status-current-format "  #[fg=colour4,bold,reverse] #I:#W #[default]"
# tmux defaults window-status-current-style to "underscore". The active
# tab already reads as reverse video, so pin it to default to drop the
# underline.
setw -g window-status-current-style default
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=colour3"
setw -g window-status-bell-style "fg=colour1"

# ── Pane borders ─────────────────────────────────────
# Tiled borders stay dim whether active or not. The active floating pane
# gets a blue border, since floating panes overlap and need a cue for
# which one takes the keys.
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=#{?pane_floating_flag,colour4,colour8}"
set -g pane-border-lines single
set -g pane-border-status bottom

# The copy-mode scrollbar: a dim slider over the terminal background.
set -g pane-scrollbars-style "fg=colour8,bg=default"

# ── Pane border status line ──────────────────────────
# The status line at the bottom of each pane shows copy-mode information,
# and a floating pane's title. Elsewhere it stays blank.
#
# In copy mode the pane border shows:
#   Left:  "-- COPY --" in green on black, and LIVE while copy mode follows
#          the pane output (R)
#   Right: when the top line entered the history, search result count, and
#          the cursor position [line/total]
#
# Format variables:
#   #{history_size}         lines scrolled off the visible area
#   #{pane_height}          visible rows in the pane
#   #{search_count}         number of search matches
#   #{search_count_partial} true while the count is still running
#   #{search_timed_out}     true when the search gave up on a long history
#   #{top_line_time}        when the top visible line entered the history
#   #{refresh_active}       true while copy mode follows the pane output
# The indicator below uses these mode constants. They live here so this file
# doesn't depend on conf.d load order. The copy-mode file defines its own.
%hidden VISUAL_LINE=2
%hidden VISUAL_BLOCK=3

# Mode indicator: VISUAL, V-LINE, or V-BLOCK while a selection is active,
# "COPY" otherwise. Reads @mode, which the copy-mode state machine sets.
%hidden COPY_MODE_LABEL="#{?#{selection_present},#{?#{==:#{@mode},$VISUAL_BLOCK},V-BLOCK,#{?#{==:#{@mode},$VISUAL_LINE},V-LINE,VISUAL}},COPY}"
%hidden COPY_MODE_LIVE="#{?refresh_active,#[fg=colour3]LIVE  ,}"
%hidden COPY_MODE_LEFT="#[align=left#,fg=green#,bg=black]  -- $COPY_MODE_LABEL --  $COPY_MODE_LIVE#[default]"
%hidden COPY_MODE_CENTER="#[align=centre#,bg=black]#[default]"
%hidden COPY_MODE_TOTAL="#{e|+|:#{history_size},#{pane_height}}"
%hidden COPY_MODE_CURSOR="#{e|+|:#{e|-|:#{history_size},#{scroll_position}},#{copy_cursor_y}}"
%hidden COPY_MODE_LOCATION="[$COPY_MODE_CURSOR/$COPY_MODE_TOTAL]"
%hidden COPY_MODE_TIME="#{?#{e|>|:#{top_line_time},0},#[fg=colour8]#{t/p:top_line_time}#[fg=default]  ,}"

%hidden HAS_SEARCH_RESULT="#{&&:#{e|>|:#{search_count},0},#{search_present}}"
%hidden RESULT_OR_RESULTS="result#{?#{==:#{search_count},1},,s}"
%hidden RESULT_COUNT_PARTIAL="#{e|>|:#{search_count_partial},0}"
%hidden SEARCH_RESULT_COUNT="(#{search_count}#{?$RESULT_COUNT_PARTIAL,+,} $RESULT_OR_RESULTS)"
%hidden SEARCH_STATUS="#{?search_timed_out,(search timed out)  ,#{?$HAS_SEARCH_RESULT,$SEARCH_RESULT_COUNT  ,}}"
%hidden COPY_MODE_RIGHT="#[align=right#,bg=black]  $COPY_MODE_TIME$SEARCH_STATUS$COPY_MODE_LOCATION  #[default]"

%hidden FLOATING_TITLE="#{?pane_floating_flag,#[align=centre] #{pane_title} ,}"

set -g pane-border-format "#{?#{==:#{pane_mode},copy-mode},$COPY_MODE_LEFT$COPY_MODE_CENTER$COPY_MODE_RIGHT,$FLOATING_TITLE}"

# ── Messages and popups ─────────────────────────────
set -g message-style "bg=default,fg=colour4"
set -g message-command-style "bg=default,fg=colour5"
set -g popup-border-style "fg=colour8"
set -g popup-border-lines "rounded"

# The theme option already maps menus to colour0 and colour7. These pin
# the rest to the palette: transparent popups, a blue selection, and dim
# borders.
set -g popup-style "bg=default,fg=colour7"
set -g menu-selected-style "bg=colour4,fg=colour0"
set -g menu-border-style "fg=colour8"

# ── Selection and copy-mode styles ─────────────────────
set -g mode-style "bg=colour4,fg=colour0"
set -g copy-mode-match-style "bg=colour3,fg=colour0"
set -g copy-mode-current-match-style "bg=colour6,fg=colour0"
set -g copy-mode-mark-style "bg=colour5,fg=colour0"
