[metadata]
name = "ssh-hosts"
description = "A channel to select hosts from your SSH config"
requirements = ["awk"]

[source]
command = "awk '$1 == \"Host\" { for (i = 2; i <= NF; i++) if ($i !~ /[*?]/) print $i }' $HOME/.ssh/config $HOME/.ssh/conf.d/*.conf 2>/dev/null"

[preview]
command = "awk '/^Host / { found=0 } /^Host (.*[[:space:]])?'{}'([[:space:]].*)?$/ { found=1 } found' $HOME/.ssh/config $HOME/.ssh/conf.d/*.conf 2>/dev/null"

[keybindings]
enter = "actions:connect"

[actions.connect]
description = "SSH into the selected host"
command = "ssh {}"
mode = "execute"
