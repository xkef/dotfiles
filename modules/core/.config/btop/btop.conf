## btop config
## https://github.com/aristocratos/btop#configurability
## btop fills unset options with defaults.

# The TTY theme uses the terminal's 16 ANSI colors, so btop follows the
# terminal theme with no hook.
color_theme = "TTY"
theme_background = false

# One view: a flat process list sorted by cpu on top, and the cpu box at
# the bottom graphs cpu above and gpu below. Left and right change the
# sort column, r reverses it, and e toggles the tree.
shown_boxes = "cpu proc"
cpu_bottom = true
cpu_graph_lower = "gpu-totals"
show_gpu_info = "On"
graph_symbol = "block"
proc_cpu_graphs = false
vim_keys = true
rounded_corners = false
update_ms = 1000

# btop rewrites its config on exit, which would dirty the repo.
save_config_on_exit = false
