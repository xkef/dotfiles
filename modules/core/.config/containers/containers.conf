# Podman settings for both systems. Linux runs containers natively and
# ignores [machine], which sizes the macOS VM at `podman machine init`.

[engine]
# Drops the notice podman compose prints on each run of docker-compose.
compose_warning_logs = false

[machine]
# libkrun, the upstream Podman 6 default, passes the GPU through to
# containers. Homebrew's podman patches the default back to applehv
# until krunkit reaches homebrew-core, so name it here. Rosetta works
# only under applehv, so amd64 images fall back to QEMU emulation.
provider = "libkrun"
cpus = 4
memory = 6144
