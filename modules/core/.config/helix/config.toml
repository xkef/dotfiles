# ── Theme ────────────────────────────────────────────
# A fixed theme. `theme` switches the terminal and Neovim, not Helix.
theme = "catppuccin_mocha"

# ── Editor ──────────────────────────────────────────
[editor]
line-number = "relative"
scrolloff = 8
shell = ["fish", "-c"]
bufferline = "multiple"
color-modes = true
true-color = true

[editor.cursor-shape]
insert = "bar"
select = "underline"

[editor.file-picker]
hidden = false

[editor.lsp]
display-inlay-hints = true

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
right = [
  "diagnostics",
  "selections",
  "register",
  "position",
  "file-encoding",
  "file-type",
]

[editor.indent-guides]
render = true
character = "┆"

[editor.soft-wrap]
enable = true

[editor.whitespace.render]
tab = "all"
nbsp = "all"

# ── Keybindings ─────────────────────────────────────
# Stays close to the neovim bindings where possible.

[keys.normal]
";" = "command_mode"
C-s = ":write"

# Window navigation matches the nvim C-hjkl.
C-h = "jump_view_left"
C-j = "jump_view_down"
C-k = "jump_view_up"
C-l = "jump_view_right"

[keys.normal.space]
e = "file_picker_in_current_buffer_directory"
E = "file_picker_in_current_directory"
q = ":quit"
Q = ":quit!"
w = ":write"

[keys.normal.space.g]
d = "goto_definition"
D = "goto_declaration"
r = "goto_reference"
i = "goto_implementation"
t = "goto_type_definition"

[keys.insert]
j = { k = "normal_mode" }
