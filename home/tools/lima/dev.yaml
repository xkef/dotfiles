# Linux dev VM on Apple Silicon: Arch with the same dotfiles setup as every
# other machine.
#
#   limactl start --name=dev ~/.config/lima/dev.yaml   create and boot
#   limactl shell dev                                  shell in the guest
#   ssh lima-dev                                       plain SSH
#   limactl delete --force dev                         throw it away
#
# Provisioning outlasts the default 10-minute start timeout, so pass
# --timeout=30m to `limactl start`.
#
# The guest sees ~/code and ~/work read-write, and this repo read-only, at
# the host's paths, so `limactl shell` opens in the current directory.
# Symlinks under the guest home point at them. Lima forwards the guest's
# ports to localhost and the host's SSH agent into the guest.
minimumLimaVersion: 2.0.0

# Weekly build from https://github.com/xkef/archlinux-lima. Lima caches it
# by URL, so `limactl prune` fetches a newer one.
images:
  - location: https://github.com/xkef/archlinux-lima/releases/latest/download/archlinux-aarch64.qcow2
    arch: aarch64

vmType: vz
memory: 8GiB

mountType: virtiofs
mounts:
  - location: ~/code
    writable: true
  - location: ~/work
    writable: true
  - location: ~/dotfiles
  # Agent hooks in the guest report to the host's `mux-agents` picker.
  - location: ~/.local/state/agents
    mountPoint: "{{.Home}}/.local/state/agents"
    writable: true

# The dotfiles expect /home/<user>, not Lima's default /home/<user>.guest.
# `limactl shell` starts user.shell, not the login shell, and the image
# ships fish for it.
user:
  home: "/home/{{.User}}"
  shell: /usr/bin/fish

ssh:
  forwardAgent: true

# setup/deploy installs the packages and sets fish as the login shell.
# `lima-agent` runs Claude Code in here.
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      pacman -Syu --noconfirm --needed git
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      for mount in $(findmnt -t virtiofs -n -o TARGET); do
        case "$mount" in "$HOME"/*) continue ;; esac
        ln -sfn "$mount" "$HOME/$(basename "$mount")"
      done
      # The Claude Code installer rewrites settings.json, so the deploy runs
      # after it and replaces the file.
      curl -fsSL https://claude.ai/install.sh | bash -s -- latest
      "$HOME/dotfiles/setup/deploy" --force --noconfirm
