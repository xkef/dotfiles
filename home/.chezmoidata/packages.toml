# Package list for both OSes. The scripts in
# home/.chezmoiscripts/run_onchange_before_10-packages-*.sh.tmpl render from
# it, so an edit here reruns them on the next apply.

[packages.darwin]
taps = [
  "tinted-theming/tinted", # tinty
]
brews = [
  "git",               # version control
  "curl",              # URL data transfer
  "less",              # pager (used as $PAGER)
  "gh",                # GitHub from the command line
  "jq",                # JSON processor
  "age",               # simple file encryption
  "terminal-notifier", # macOS notifications from scripts
  "fish",              # shell
  "starship",          # cross-shell prompt
  "atuin",             # shell history search/sync
  "fzf",               # fuzzy finder
  "television",        # fuzzy finder with channels
  "zoxide",            # smarter cd with frecency
  "helix",             # modal text editor (Rust)
  "neovim",            # text editor
  "tree-sitter-cli",   # parser generator CLI (nvim-treesitter build)
  "tinty",             # color scheme switcher
  "presenterm",        # markdown-driven terminal slides
  "eza",               # modern ls replacement
  "bat",               # cat with syntax highlighting
  "fd",                # modern find replacement
  "ripgrep",           # fast recursive grep
  "xh",                # fast HTTP client (HTTPie-compatible)
  "hurl",              # HTTP request testing with plain text files
  "sd",                # intuitive find-and-replace (sed alt)
  "dust",              # disk usage viewer (du alt)
  "duf",               # disk free viewer (df alt)
  "procs",             # modern ps replacement
  "trash",             # move files to trash instead of rm
  "ouch",              # compress/decompress archives
  "delta",             # syntax-highlighting diff pager
  "difftastic",        # structural diff tool
  "lazygit",           # terminal UI for git
  "jj",                # Jujutsu version control
  "jjui",              # terminal UI for jj
  "onefetch",          # git repo summary in terminal
  "mise",              # dev tool version manager
  "rustup",            # Rust toolchain manager (keg-only, PATH in env.fish)
  "go",                # Go (go.mod pins newer toolchains)
  "uv",                # Python package and version manager
  "python",            # Python for scripts outside projects
  "node",              # Node.js for npx outside projects
  "rumdl",             # markdown linter (LazyVim in every buffer)
  "dprint",            # markdown formatter (LazyVim in every buffer)
  "jdtls",             # Java language server
  "nono",              # capability-based sandbox for AI agents
  "ccusage",           # Claude Code usage analyzer
  "devcontainer",      # dev container CLI
  "podman",            # rootless container engine
  "lazydocker",        # terminal UI for Docker/Podman
  "fx",                # terminal JSON viewer
  "scooter",           # interactive find-and-replace TUI
  "lima",              # Linux dev VMs (~/.config/lima/dev.yaml)
  "yazi",              # terminal file manager
  "glow",              # terminal markdown renderer
  "vale",              # prose linter for markdown
  "tokei",             # code statistics by language
  "tealdeer",          # fast tldr client
  "htop",              # interactive process viewer
  "hyperfine",         # command-line benchmarking
  "bandwhich",         # per-process bandwidth monitor
  "xdg-ninja",         # audit XDG base-dir compliance
]
casks = [
  "codex",                         # OpenAI Codex CLI (shipped as a cask)
  "wezterm@nightly",               # terminal and multiplexer (no stable release since 2024-02)
  "zed",                           # GPU-accelerated code editor
  "neovide-app",                   # GUI client for Neovim
  "1password",                     # password manager
  "1password-cli",                 # 1Password CLI (op)
  "dockdoor",                      # Dock previews and window switcher
  "firefox@developer-edition",     # Firefox Developer Edition browser
  "handy",                         # offline speech-to-text app
  "hiddenbar",                     # hide menu bar icons
  "rectangle",                     # window snapping via keyboard
  "font-jetbrains-mono-nerd-font", # patched dev font with icons
]

