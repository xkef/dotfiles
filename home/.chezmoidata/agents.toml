# Registry of sandboxed AI agents. The fish launchers in conf.d/agents.fish,
# the `sb` dispatch and its completions, and the nono profiles all render
# from this file. Rules templates and settings merges stay one file per
# agent because chezmoi needs a source file per target.
#
# Fields:
#   description  function description and `sb` completion text
#   install      fish command the launcher runs when the binary is missing.
#                Absent means the package manager installs it.
#   prelaunch    fish snippet the launcher runs before starting the agent
#   args         arguments `sb` passes to the agent inside the sandbox
#   touch        files `sb` creates before launch so allow_file grants apply
#   nono         profile data: version, description, extra policy groups,
#                agent state paths, and `extra` for fields beyond the shared
#                toolchain surface in .chezmoitemplates/nono-profile.tmpl

[agents.claude]
description = "Claude Code"
install = "curl -fsSL https://claude.ai/install.sh | bash -s -- latest"
# nono is the OS-level sandbox, and macOS can't nest Seatbelt, so Claude
# Code's own bash sandbox stays off. With it on, every Bash command fails
# with "sandbox_apply: Operation not permitted".
args = ["--settings", '{"sandbox":{"enabled":false}}']
touch = ["$HOME/.claude.json.lock"]

[agents.claude.nono]
version = "1.3.1"
description = "Claude Code with mise, jj, maven, npm, cargo, shared skills, and keychain access"
# Copied from the registry pack always-further/claude. The pack still uses
# the `undo` field that nono 0.75 renamed to `rollback`, so nono rejects it.
# Once the pack updates, drop groups, allow_file, and extra, and set
# `extends: "claude-code"`.
groups = [
  { name = "claude_code_macos", when = "macos" },
  { name = "claude_code_linux", when = "linux" },
  { name = "claude_cache_linux", when = "linux" },
  "rust_runtime",
  "python_runtime",
  { name = "vscode_macos", when = "macos" },
  { name = "vscode_linux", when = "linux" },
  { name = "linux_sysfs_read", when = "linux" },
  "nix_runtime",
]
allow = [
  "$HOME/.claude",
  "$HOME/.local/state/claude/locks",
  "$HOME/.cache/claude",
  "$HOME/.config/nono/profile-drafts",
  "/tmp/claude-$UID",
]
allow_file = [
  "$HOME/.claude.json",
  "$HOME/.claude.json.lock",
  "$HOME/.claude.lock",
]

[agents.claude.nono.extra]
network = { block = false }
allow_launch_services = true
security = { signal_mode = "isolated", capability_elevation = false }
diagnostics = { suppress_system_services = ["forbidden-exec-sugid"] }

[agents.claude.nono.extra.open_urls]
allow_origins = [
  "https://claude.ai",
  "https://claude.com",
  "https://api.anthropic.com",
  "https://platform.claude.com",
]
allow_localhost = true

[agents.claude.nono.extra.rollback]
exclude_patterns = ["node_modules", ".next", "__pycache__", "target"]
exclude_globs = ["*.tmp.[0-9]*.[0-9]*"]

[agents.codex]
description = "OpenAI Codex CLI"
# Codex nests its own Seatbelt policy, which macOS refuses inside nono, so
# nono alone holds the OS boundary. This relaxes only the sandbox. The
# approval policy stays on.
args = ["-s", "danger-full-access"]

[agents.codex.nono]
version = "1.0.2"
description = "OpenAI Codex CLI with mise, node, jj, maven, npm, cargo, shared skills, and keychain access"
allow = ["$HOME/.codex"]

[agents.pi]
description = "pi.dev coding agent"
install = "npm install -g @earendil-works/pi-coding-agent"
# pi picks its theme by name from a file the theme.d adapter renders. A
# machine that has never switched themes has no file yet, and pi falls back
# to its built-in dark theme without reporting it. Render the current theme
# once.
prelaunch = '''
set -l pi_agent_dir (set -q PI_CODING_AGENT_DIR && echo $PI_CODING_AGENT_DIR || echo $HOME/.pi/agent)
if command -q theme; and not test -f $pi_agent_dir/themes/dots.json
    theme (theme --current) >/dev/null
end'''

[agents.pi.nono]
version = "1.1.2"
description = "pi.dev coding agent with mise, node, jj, maven, npm, cargo, shared skills, and keychain access"
allow = [
  "$HOME/.pi",
  "$XDG_CONFIG_HOME/pi",
  "$XDG_DATA_HOME/pi",
  "$XDG_STATE_HOME/pi",
  "$XDG_CACHE_HOME/pi",
]
