# Neovim leader and WezTerm leader. Each key has the form its tool reads
# and a label for help text. The WezTerm leader pairs with the Neovim
# leader, after wincent, so one physical key serves both. Ctrl-A and Ctrl-B
# stay free for readline.

[keys]
leader = " "
leader_label = "Space"
prefix = "Space"
prefix_mods = "CTRL"
prefix_label = "Ctrl-Space"
