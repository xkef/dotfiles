
[mgr]
sort_by = "natural"
linemode = "size"

[opener]
edit = [{ run = '${EDITOR:-nvim} %s', block = true, for = "unix" }]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "*/xml", use = "edit" },
  { url = "*.toml", use = "edit" },
]
