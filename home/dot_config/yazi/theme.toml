# Uses the terminal palette, so it follows the active theme without
# hardcoded hex values.

[mgr]
cwd = { fg = "cyan", bold = true }

find_position = { fg = "magenta", bg = "reset", italic = true }

marker_selected = { fg = "green", bg = "green" }
marker_copied = { fg = "yellow", bg = "yellow" }
marker_cut = { fg = "red", bg = "red" }

count_copied = { fg = "black", bg = "yellow" }
count_cut = { fg = "black", bg = "red" }
count_selected = { fg = "black", bg = "green" }

border_style = { fg = "darkgray" }

[tabs]
active = { fg = "black", bg = "cyan" }
inactive = { fg = "white", bg = "darkgray" }

[mode]
normal_main = { fg = "black", bg = "cyan", bold = true }
select_main = { fg = "black", bg = "green", bold = true }
unset_main = { fg = "black", bg = "magenta", bold = true }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label = { fg = "white", bold = true }
progress_normal = { fg = "cyan", bg = "black" }
progress_error = { fg = "red", bg = "black" }

perm_type = { fg = "cyan" }
perm_read = { fg = "yellow" }
perm_write = { fg = "red" }
perm_exec = { fg = "green" }

[input]
border = { fg = "cyan" }

[pick]
border = { fg = "cyan" }
active = { fg = "magenta" }

[cmp]
border = { fg = "cyan" }
active = { bg = "darkgray" }
icon_file = ""
icon_folder = ""
icon_command = ""

[tasks]
border = { fg = "cyan" }
hovered = { underline = true }

[which]
mask = { bg = "darkgray" }
cand = { fg = "cyan" }
desc = { fg = "magenta" }

[help]
chord = { fg = "magenta" }
action = { fg = "cyan" }
hovered = { bg = "darkgray", bold = true }

[filetype]
rules = [
  { mime = "image/*", fg = "magenta" },
  { mime = "video/*", fg = "yellow" },
  { mime = "audio/*", fg = "yellow" },
  { mime = "application/zip", fg = "red" },
  { mime = "application/gzip", fg = "red" },
  { mime = "application/tar", fg = "red" },
  { mime = "application/bzip*", fg = "red" },
  { mime = "application/xz", fg = "red" },
  { mime = "application/zstd", fg = "red" },
  { mime = "application/7z-compressed", fg = "red" },
  { mime = "application/rar", fg = "red" },
  { url = "*.md", fg = "cyan" },
  { url = "*.rs", fg = "red" },
  { url = "*.go", fg = "cyan" },
  { url = "*.ts", fg = "blue" },
  { url = "*.tsx", fg = "blue" },
  { url = "*.js", fg = "yellow" },
  { url = "*.jsx", fg = "yellow" },
  { url = "*.py", fg = "green" },
  { url = "*.lua", fg = "blue" },
  { url = "*.sh", fg = "green" },
  { url = "*.zsh", fg = "green" },
  { url = "*.toml", fg = "red" },
  { url = "*.yaml", fg = "red" },
  { url = "*.yml", fg = "red" },
  { url = "*.json", fg = "yellow" },
  { url = "*.lock", fg = "darkgray" },
  { url = "*.log", fg = "darkgray" },
  { url = "*", fg = "white" },
  { url = "*/", fg = "cyan" },
]
