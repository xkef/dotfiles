[settings]
fetch_remote_versions_cache = "7d"
# Fuzzy versions such as "3.14" resolve only to releases older than 7 days.
# Exact pins bypass the cooldown.
minimum_release_age = "7d"
# Projects pin node and java in .node-version and .java-version.
idiomatic_version_file_enable_tools = ["node", "java"]

# No global tools. Brew and pacman supply what every shell needs, and each
# project pins the rest.
