# ── Vi copy mode ─────────────────────────────────────
# Copy mode scrolls, searches, and selects text from the scrollback buffer.
# With mode-keys vi, hjkl moves, / searches, and v, V, and C-v select, as
# in vim. See "COPY MODE" in man tmux.

# ── Vim-mode state machine ───────────────────────────
# Mode constants for the visual selection state machine. They live here
# rather than in a separate file so conf.d load order doesn't matter. @mode
# holds the current state.
%hidden NORMAL=0
%hidden VISUAL=1
%hidden VISUAL_LINE=2
%hidden VISUAL_BLOCK=3
set -g @mode $NORMAL

setw -g mode-keys vi
setw -g status-keys vi

# Line numbers in copy mode, tmux 3.7+: the current line absolute, the others
# relative, like vim's number plus relativenumber. Stays off when the mouse
# opens copy mode.
set -g copy-mode-line-numbers hybrid

# @key tmux :: Enter :: Enter copy mode
bind Enter copy-mode

# ── Search ───────────────────────────────────────────
# @key tmux :: / :: Search forward (enters copy mode)
# command-prompt -i updates results while typing. -I "#{pane_search_string}"
# prefills the last search term. -T search selects the "search" key table.
# See "COMMAND-PROMPT" in man tmux.
bind / {
  copy-mode
  command-prompt -i -I "#{pane_search_string}" -T search -p "(search down)" {
    send-keys -X search-forward-incremental "%%"
  }
}

# @key copy :: / / ? :: Search forward / backward
bind -T copy-mode-vi / command-prompt -i -I "#{pane_search_string}" -T search -p "(search down)" {
  send-keys -X search-forward-incremental "%%"
}
bind -T copy-mode-vi ? command-prompt -i -I "#{pane_search_string}" -T search -p "(search up)" {
  send-keys -X search-backward-incremental "%%"
}

# ── Visual selection state machine ───────────────────
# Vim-like v, V, and C-v toggling in copy mode. Each key cycles through
# modes. v in VISUAL returns to NORMAL and clears the selection. v in
# VISUAL_BLOCK switches to VISUAL. #{selection_present} reports an active
# selection. rectangle-on and rectangle-off switch between character and
# block selection. See "COPY MODE" in man tmux.

# v: toggle VISUAL and NORMAL, or switch from LINE or BLOCK to VISUAL
bind -T copy-mode-vi v if-shell -F '#{selection_present}' {
    if-shell -F '#{||:#{==:#{@mode},#{VISUAL_BLOCK}},#{==:#{@mode},#{VISUAL_LINE}}}' {
      send-keys -X rectangle-off
      set -g @mode $VISUAL
    } {
      send-keys -X rectangle-off
      send-keys -X clear-selection
      set -g @mode $NORMAL
    }
  } {
    send-keys -X rectangle-off
    send-keys -X begin-selection
    set -g @mode $VISUAL
  }

# V: toggle VISUAL_LINE and NORMAL, or switch from VISUAL or BLOCK to LINE
bind -T copy-mode-vi V if-shell -F '#{selection_present}' {
    if-shell -F '#{||:#{==:#{@mode},#{VISUAL}},#{==:#{@mode},#{VISUAL_BLOCK}}}' {
      send-keys -X rectangle-off
      send-keys -X select-line
      set -g @mode $VISUAL_LINE
    } {
      send-keys -X clear-selection
      set -g @mode $NORMAL
    }
  } {
    send-keys -X rectangle-off
    send-keys -X select-line
    set -g @mode $VISUAL_LINE
  }

# C-v: toggle VISUAL_BLOCK and NORMAL, or switch from VISUAL or LINE to BLOCK
bind -T copy-mode-vi C-v if-shell -F '#{selection_present}' {
    if-shell -F '#{||:#{==:#{@mode},#{VISUAL}},#{==:#{@mode},#{VISUAL_LINE}}}' {
      send-keys -X rectangle-on
      set -g @mode $VISUAL_BLOCK
    } {
      send-keys -X rectangle-off
      send-keys -X clear-selection
      set -g @mode $NORMAL
    }
  } {
    send-keys -X rectangle-on
    send-keys -X begin-selection
    set -g @mode $VISUAL_BLOCK
  }

# ── Yank ─────────────────────────────────────────────
# y copies the selection to the system clipboard over OSC 52, since
# set-clipboard is on, and leaves copy mode. Y copies to the end of the line.
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y   send-keys -X copy-end-of-line

# @key copy :: Escape / q :: Cancel
bind -T copy-mode-vi Escape { send-keys -X cancel; set -g @mode $NORMAL }
bind -T copy-mode-vi q      { send-keys -X cancel; set -g @mode $NORMAL }

# ── Navigation ──────────────────────────────────────
# @key copy :: H / L :: Top / bottom of screen (tmux default)

# @key copy :: Ctrl-u / d :: Half page up / down
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down

# ── Mouse integration ────────────────────────────────
# By default the end of a mouse drag copies and leaves copy mode. Stay in
# copy mode instead so the selection stays adjustable.
unbind -T copy-mode-vi MouseDragEnd1Pane

# Scroll 3 lines at a time instead of the default 5. Clear any selection on
# scroll so it can't grow by accident.
bind -T copy-mode-vi WheelUpPane {
  select-pane
  send-keys -t'{mouse}' -X clear-selection
  send-keys -t'{mouse}' -X -N 3 scroll-up
  set -g @mode $NORMAL
}
bind -T copy-mode-vi WheelDownPane {
  select-pane
  send-keys -t'{mouse}' -X clear-selection
  send-keys -t'{mouse}' -X -N 3 scroll-down
  set -g @mode $NORMAL
}

# A mouse drag starts a character-wise visual selection. #{mouse_any_flag}
# reports that the program in the pane, such as vim or less, handles mouse
# events. Then send-keys -M forwards the event.
bind -T root MouseDrag1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" {
  send-keys -M
  send-keys -X rectangle-off
  set -g @mode $VISUAL
} {
  copy-mode -M
  send-keys -X rectangle-off
  set -g @mode $VISUAL
}

# The scroll wheel enters copy mode unless the pane already runs it or the
# pane's program handles the mouse. -e leaves copy mode at the bottom.
bind -T root WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" {
  send-keys -M
  if-shell -F "#{pane_in_mode}" "send-keys -X rectangle-off"
  set -g @mode $NORMAL
} {
  copy-mode -e
  send-keys -X rectangle-off
  set -g @mode $NORMAL
}
