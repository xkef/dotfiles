# ── Appearance ────────────────────────────────────────
# Every style uses an ANSI palette slot, colour0 to colour15, instead of a
# hex value. The `theme` command in ~/.local/bin/theme updates the Ghostty
# config, which reloads the terminal palette. tmux references the slots, so
# it follows without per-theme config or OSC sequences.
#
# ANSI slots. Values vary by theme, roles stay stable:
#   colour0  = dark bg    colour8  = bright black (dim/border)
#   colour1  = red        colour9  = bright red
#   colour2  = green      colour10 = bright green
#   colour3  = yellow     colour11 = bright yellow
#   colour4  = blue       colour12 = bright blue
#   colour5  = magenta    colour13 = bright magenta
#   colour6  = cyan       colour14 = bright cyan
#   colour7  = light bg   colour15 = bright white

set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 80

# Highlight a window tab when it changes in the background, without a
# status message.
setw -g monitor-activity on
set -g visual-activity off

# ── Status bar ───────────────────────────────────────
# bg=default inherits the terminal background. The status line shows
# tmux-level info only: session, windows, time. Directory and git branch
# belong in the starship prompt.
set -g status-style "bg=default,fg=default"

# Left: session name in magenta, then a § separator, after wincent.
set -g status-left "#[fg=colour5,bold,italics]#S § #[default]"

# Right: a yellow Z when a pane is zoomed, agent count, system stats from
# the tmux-sysstat script, dim clock, and hostname.
set -g status-right "#{?window_zoomed_flag,#[fg=colour3]Z,#[fg=default] }  #(tmux-agents --count)#(tmux-sysstat)  #[fg=colour8]%H:%M  #[fg=colour6,bold]#h "

# ── Window tabs ──────────────────────────────────────
# tmux names each window after the running command. A tab reads
# " index:command ", and the active one uses bold blue reverse video. Agent
# windows use @agent-slug so the tab keeps showing the workspace even when
# the agent emits a title or rename sequence. The format strings carry the
# spacing, so window-status-separator stays empty.
%hidden WINDOW_LABEL="#{?#{==:#{@agent-slug},},#W,a/#{@agent-slug}}"
setw -g automatic-rename on
setw -g window-status-format "  #[fg=colour8] #I:$WINDOW_LABEL #[default]"
setw -g window-status-current-format "  #[fg=colour4,bold,reverse] #I:$WINDOW_LABEL #[default]"
# tmux 3.7 defaults window-status-current-style to "underscore". The active
# tab already reads as reverse video, so pin it to default to drop the
# underline.
setw -g window-status-current-style default
setw -g window-status-separator ""
setw -g window-status-activity-style "fg=colour3"
setw -g window-status-bell-style "fg=colour1"

# ── Pane borders ─────────────────────────────────────
# The status line at the bottom of each pane shows copy-mode information:
# scroll position and search results.
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour8"
set -g pane-border-lines single
set -g pane-border-status bottom

# ── Copy mode pane border ────────────────────────────
# In copy mode the pane border shows:
#   Left:  "-- COPY --" in green on black
#   Right: scroll position [offset/total] and search result count, tmux 3.5+
#
# Format variables:
#   #{history_size}         lines scrolled off the visible area
#   #{pane_height}          visible rows in the pane
#   #{search_count}         number of search matches, tmux 3.5+
#   #{search_count_partial} true while the count is still running
# The indicator below uses these mode constants. They live here so this file
# doesn't depend on conf.d load order. The copy-mode file defines its own.
%hidden VISUAL_LINE=2
%hidden VISUAL_BLOCK=3

# Mode indicator: VISUAL, V-LINE, or V-BLOCK while a selection is active,
# "COPY" otherwise. Reads @mode, which the copy-mode state machine sets.
%hidden COPY_MODE_LABEL="#{?#{selection_present},#{?#{==:#{@mode},$VISUAL_BLOCK},V-BLOCK,#{?#{==:#{@mode},$VISUAL_LINE},V-LINE,VISUAL}},COPY}"
%hidden COPY_MODE_LEFT="#[align=left#,fg=green#,bg=black]  -- $COPY_MODE_LABEL --  #[default]"
%hidden COPY_MODE_CENTER="#[align=centre#,bg=black]#[default]"
%hidden COPY_MODE_TOTAL="#{e|+|:#{history_size},#{pane_height}}"
%hidden COPY_MODE_CURSOR="#{e|+|:#{e|-|:#{history_size},#{scroll_position}},#{copy_cursor_y}}"
%hidden COPY_MODE_LOCATION="[$COPY_MODE_CURSOR/$COPY_MODE_TOTAL]"

%hidden HAS_SEARCH_RESULT="#{&&:#{e|>|:#{search_count},0},#{search_present}}"
%hidden RESULT_OR_RESULTS="result#{?#{==:#{search_count},1},,s}"
%hidden RESULT_COUNT_PARTIAL="#{e|>|:#{search_count_partial},0}"
%hidden SEARCH_RESULT_COUNT="(#{search_count}#{?$RESULT_COUNT_PARTIAL,+,} $RESULT_OR_RESULTS)"
%hidden COPY_MODE_RIGHT="#[align=right#,bg=black]  #{?$HAS_SEARCH_RESULT,$SEARCH_RESULT_COUNT  ,}$COPY_MODE_LOCATION  #[default]"

# The pane border format renders in copy mode only.
set -g pane-border-format "#{?#{==:#{pane_mode},copy-mode},$COPY_MODE_LEFT$COPY_MODE_CENTER$COPY_MODE_RIGHT,}"

# ── Messages and popups ─────────────────────────────
set -g message-style "bg=default,fg=colour4"
set -g message-command-style "bg=default,fg=colour5"
set -g popup-border-style "fg=colour8"
set -g popup-border-lines "rounded"

# tmux 3.7 has menu and popup fill defaults that use theme* colors keyed on
# the light or dark mode the terminal reports in #{client_theme}. That
# renders wrong when the active palette doesn't match the OS appearance, such
# as a dark theme under a light-mode OS, so pin these to ANSI slots too.
set -g popup-style "bg=default,fg=colour7"
set -g menu-style "bg=colour0,fg=colour7"
set -g menu-selected-style "bg=colour4,fg=colour0"
set -g menu-border-style "fg=colour8"

# ── Selection and copy-mode styles ─────────────────────
set -g mode-style "bg=colour4,fg=colour0"
set -g copy-mode-match-style "bg=colour3,fg=colour0"
set -g copy-mode-current-match-style "bg=colour6,fg=colour0"
set -g copy-mode-mark-style "bg=colour5,fg=colour0"
