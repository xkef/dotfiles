# ── Keybindings ───────────────────────────────────────
# Every binding follows the prefix key unless noted.
# `bind -r` makes a binding repeatable within repeat-time, default 500ms,
# without pressing the prefix again. See "KEY BINDINGS" in man tmux.

# @key tmux :: r :: Reload tmux config
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display "Config reloaded"

# @key tmux :: Ctrl-l :: Clear scrollback history
bind C-l clear-history

# ── Pane navigation across tmux and neovim ───────────
# When the active pane runs neovim or fzf, send-keys forwards the key so
# smart-splits.nvim handles the move across splits. Otherwise tmux selects
# the adjacent pane. The is_vim check reads the foreground process name
# with ps on the pane's tty and matches vim, nvim, view, vimdiff, and fzf.
# See https://github.com/mrjones2014/smart-splits.nvim#tmux
#
# @key tmux :: h/j/k/l :: Navigate panes
# Unbind bare C-hjkl first. These bindings use prefix+hjkl, which leaves
# C-hjkl free for shell line editing, such as Ctrl-H for backspace.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?$'"
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
bind h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# ── Splits and windows ──────────────────────────────
# @key tmux :: | / - :: Split right / down
# -c "#{pane_current_path}" makes a new pane or window inherit the current
# directory instead of the directory tmux started in.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# @key tmux :: c :: New window
bind c new-window -c "#{pane_current_path}"

# @key tmux :: * :: Floating pane (tmux 3.7+), non-modal overlay above the layout
# Unlike display-popup, which is modal and closes when its command exits, a
# floating pane is a real pane. It persists while you work in the tiled panes
# beneath it. It opens centered at 80%: -x/-y set the size, -X/-Y the offset,
# (100-80)/2 = 10%. Resize with prefix H/J/K/L, zoom with z, move it with the
# mouse, close it with exit.
bind * new-pane -c "#{pane_current_path}" -x 80% -y 80% -X 10% -Y 10%

# Floating launchers: the same centered overlay, preloaded with a tool.
# vcs.conf binds G to jjui and g to the lazygit popup.
# @key tmux :: e :: Floating file manager (yazi)
bind e new-pane -c "#{pane_current_path}" -x 80% -y 80% -X 10% -Y 10% yazi

# @key tmux :: z :: Toggle pane zoom (fullscreen)
bind z resize-pane -Z

# @key tmux :: H/J/K/L :: Resize pane (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# @key tmux :: n / p :: Next / previous window
bind -r n next-window
bind -r p previous-window
# @key tmux :: Tab :: Last window
bind Tab last-window

# @key tmux :: < / > :: Swap window left / right
# -d keeps focus on the moved window
bind -r '<' swap-window -d -t '{previous}'
bind -r '>' swap-window -d -t '{next}'

# ── Sesh session manager ──────────────────────────────
# sesh creates and switches tmux sessions by project through zoxide. It
# stays optional on Arch ARM, which has no AUR package for it. Bindings run
# through `fish -c` so conf.d builds PATH, and with it the go, cargo, and
# local-bin tools such as sesh, independent of the tmux server's
# environment, which may predate a fresh install.
# See https://github.com/joshmedeski/sesh

# @key tmux :: f :: Sesh picker (sessions + projects)
bind f run-shell "fish -c tmux-sesh"

# @key tmux :: F :: Toggle last session (sesh)
bind F run-shell "fish -c 'if command -q sesh; sesh last || tmux display-message \"No previous session\"; else; tmux display-message \"sesh is not installed\"; end'"

# ── Agents ────────────────────────────────────────────
# Cross-session view of every running coding agent. Claude Code reports state
# from a hook and pi from an extension. Both inherit $TMUX_PANE from the pane
# the agent runs in, which lets the picker map a state back to its pane.
# @key tmux :: a :: Agent picker (all sessions)
bind a display-popup -w 95% -h 85% -E "fish -c tmux-agents"

# @key tmux :: w :: Switch window, all sessions
# Each line reads "session:index window_name". cut extracts the target.
bind w display-popup -E -w 60% -h 60% "\
  tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | \
  fzf --reverse --header 'switch window' | \
  cut -d' ' -f1 | \
  xargs tmux switch-client -t"

# @key tmux :: ? :: This reference (floating popup)
bind ? display-popup -w 60% -h 80% -E 'dots-keys --raw | glow -p -'

# @key tmux :: S :: New named session
bind S command-prompt -p "New session:" "new-session -s '%%'"
# @key tmux :: s :: Browse sessions
bind s choose-tree -Zs

# ── Prompt navigation ────────────────────────────────
# Jump between shell prompts in scrollback through OSC 133 prompt marks.
# See https://github.com/tmux/tmux/wiki/FAQ#how-do-i-jump-between-prompts
# @key tmux :: o / i :: Jump to prev / next prompt
bind o { copy-mode; send-keys -X previous-prompt }
bind i { copy-mode; send-keys -X next-prompt }
# @key copy :: o / i :: Previous / next prompt
bind -T copy-mode-vi -r o { send-keys -X previous-prompt }
bind -T copy-mode-vi -r i { send-keys -X next-prompt }
