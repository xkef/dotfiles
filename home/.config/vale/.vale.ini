; Global Vale config. Vale loads it from $XDG_CONFIG_HOME/vale/.vale.ini
; whenever a project has no .vale.ini of its own, so prose linting works in
; every markdown buffer.
;
; StylesPath is relative to this file. `vale sync` downloads the packages into
; ~/.config/vale/styles, next to the linked Base vocabulary. Only the
; vocabulary is tracked.
;
; Google, write-good, proselint, alex, and neighbor come from the official
; package library. ai-tells is a third-party package pinned to a release. To
; update it, bump the tag and run `vale sync`.
; https://github.com/tbhb/vale-ai-tells/releases
;
; The dotfiles repo lints its own markdown with this file through
; `mise run lint-prose`, which fails on any alert.

StylesPath = styles
Vocab = Base
Packages = Google, write-good, proselint, alex, neighbor, https://github.com/tbhb/vale-ai-tells/releases/download/v1.31.0/ai-tells.zip

[*.{md,markdown,txt}]
BasedOnStyles = Vale, Google, write-good, proselint, alex, neighbor, ai-tells

; The Base vocabulary is a spelling allowlist only. Vale.Terms would turn
; every entry into a casing rule too, which flags them at sentence start.
Vale.Terms = NO

; Flags 'hook' and 'color' as possibly profane.
alex.ProfanityUnlikely = NO
