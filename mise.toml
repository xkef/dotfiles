[tools]
# check encrypts and decrypts test files.
age = "1"
"github:SuperCuber/dotter" = "0.13.5"
dprint = "0"
rumdl = "0"
shellcheck = "0"
shfmt = "3"
stylua = "2"
taplo = "0"
vale = "3"
zizmor = "1"

[vars]
shell_files = "$(shfmt -f .)"
# Scripts without a .fish extension count through their shebang.
fish_files = """\
  $(git ls-files '*.fish') \
  $(git grep -l '^#!/usr/bin/env fish' -- modules)"""

[tasks.fmt]
description = "Format all dotfiles"
run = [
  "stylua modules/",
  "shfmt -w {{vars.shell_files}}",
  "fish_indent -w {{vars.fish_files}}",
  "dprint fmt --config .config/dprint.json",
  "taplo fmt",
]

[tasks.lint]
description = "Lint everything"
depends = [
  "lint-sh",
  "lint-fish",
  "lint-fmt",
  "lint-md",
  "lint-prose",
  "lint-nvim",
  "lint-wezterm",
  "lint-pi",
  "lint-actions",
]

[tasks.test]
description = "Run the behavior tests. Needs fish, jq, and jj."
depends = ["test:*"]

[tasks.lint-sh]
description = "Check bash scripts with shellcheck"
run = "shellcheck -S warning {{vars.shell_files}}"

[tasks.lint-fish]
description = "Check fish syntax"
run = """
for f in {{vars.fish_files}}; do
  fish --no-execute "$f" || exit 1
done
"""

[tasks.lint-fmt]
description = "Check Lua, markdown, JSON, and YAML formatting"
run = ["stylua --check modules/", "dprint check --config .config/dprint.json"]

[tasks.lint-pi]
description = "Type-check the pi extensions. Needs node."
dir = ".config/pi"
run = "npm ci --no-audit --no-fund && npx tsc"

[tasks.lint-actions]
description = "Audit the workflows and Dependabot config with zizmor"
# zizmor rejects an empty token, which agent sandboxes set. Without a
# token it skips the audits that query GitHub.
run = '[ -n "${GITHUB_TOKEN:-}" ] || unset GITHUB_TOKEN; zizmor .'

[tasks.lint-md]
description = "Lint markdown"
run = "rumdl check"

[tasks.vale-sync]
description = "Download the vale style packages"
run = "vale --no-global --config .config/vale/.vale.ini sync"

# WezTerm exits 0 on a config error and falls back to its defaults, so the
# task fails on the logged ERROR instead. The config loads once without the
# agents package and once with it, as each machine deploys it.
[tasks.lint-wezterm]
description = "Load the WezTerm config headless. Needs wezterm."
run = """
for modules in desktop 'desktop agents'; do
  export XDG_CONFIG_HOME=$(mktemp -d "${TMPDIR:-/tmp}/wezterm.XXXXXX")
  export WEZTERM_CONFIG_FILE=$XDG_CONFIG_HOME/wezterm/wezterm.lua
  mkdir "$XDG_CONFIG_HOME/wezterm"
  for module in $modules; do
    cp modules/$module/.config/wezterm/*.lua "$XDG_CONFIG_HOME/wezterm"
  done
  if wezterm ls-fonts 2>&1 >/dev/null | grep ERROR; then
    echo "wezterm config fails with: $modules" >&2
    exit 1
  fi
done
"""

# Neovim exits 0 after a startup error, so the task fails on the error
# message that startup left in v:errmsg instead. A throwaway state
# directory keeps the check from writing LazyVim state, which the sandbox
# doesn't grant.
[tasks.lint-nvim]
description = "Load LazyVim headless. Needs its plugins installed."
env = { NVIM_APPNAME = "lazyvim" }
run = """XDG_STATE_HOME=$(mktemp -d) nvim --headless -c "lua require('lazy')" -c 'if v:errmsg != "" | cquit | else | qall | endif'"""
