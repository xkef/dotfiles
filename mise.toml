[tools]
"github:SuperCuber/dotter" = "0.13"
dprint = "0"
rumdl = "0"
shellcheck = "0"
shfmt = "3"
stylua = "2"
taplo = "0"
vale = "3"

[vars]
shell_files = "$(shfmt -f .)"
# Scripts without a .fish extension count through their shebang.
fish_files = """\
  $(git ls-files '*.fish') \
  $(git grep -l '^#!/usr/bin/env fish' -- home)"""

[tasks.fmt]
description = "Format all dotfiles"
run = [
  "stylua home/editors/nvim/ home/terminal/wezterm/",
  "shfmt -w {{vars.shell_files}}",
  "fish_indent -w {{vars.fish_files}}",
  "dprint fmt --config .config/dprint.json",
  "taplo fmt",
]

[tasks.lint]
description = "Lint everything"
depends = [
  "lint-sh",
  "lint-fish",
  "lint-fmt",
  "lint-md",
  "lint-prose",
  "lint-nvim",
  "lint-wezterm",
]

[tasks.lint-sh]
description = "Check bash scripts with shellcheck"
run = "shellcheck -S warning {{vars.shell_files}}"

[tasks.lint-fish]
description = "Check fish syntax"
run = """
for f in {{vars.fish_files}}; do
  fish --no-execute "$f" || exit 1
done
"""

[tasks.lint-fmt]
description = "Check markdown, JSON, and YAML formatting"
run = "dprint check --config .config/dprint.json"

[tasks.lint-md]
description = "Lint markdown"
run = "rumdl check"

[tasks.vale-sync]
description = "Download the vale style packages"
run = "vale --no-global --config home/tools/vale/.vale.ini sync"

# WezTerm exits 0 on a config error and falls back to its defaults, so the
# task fails on the logged ERROR instead.
[tasks.lint-wezterm]
description = "Load the WezTerm config headless. Needs wezterm."
run = """
export XDG_CONFIG_HOME=$(mktemp -d)
export WEZTERM_CONFIG_FILE=$XDG_CONFIG_HOME/wezterm/wezterm.lua
mkdir "$XDG_CONFIG_HOME/wezterm"
cp home/terminal/wezterm/*.lua "$XDG_CONFIG_HOME/wezterm"
! wezterm ls-fonts 2>&1 >/dev/null | grep ERROR
"""

[tasks.lint-nvim]
description = "Load LazyVim headless. Needs its plugins installed."
env = { NVIM_APPNAME = "lazyvim" }
run = """nvim --headless -c "lua require('lazy')" -c qa"""
